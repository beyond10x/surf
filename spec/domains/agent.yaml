domain: surf.agent

summary: >-
  A browser session an AI agent drives from a command line: opened once, acted on with a token,
  read back as text, closed. Every action of the agent is mapped onto the commands the other
  components already accept; this domain holds only what the agent's session adds to them. The
  `agent` component holds it.

naming:
  wire: agent
  display: Agent

types:
  - name: surf.agent.SessionId
    kind: newtype
    of: Uuid
    naming:
      summary: The identity of a session, drawn by `open`; not secret, it appears in listings.

  # Minted by the component when the action is recorded: no command addresses an action after
  # that, so no caller needs to name one in advance. Unique across every session, which the
  # sequence number alone is not.
  - name: surf.agent.ActionId
    kind: newtype
    of: Uuid
    naming:
      summary: The identity of one recorded action.

  # The command word of an action as the `path` and `did` lines print it (`docs/agent-answer.md`).
  - name: surf.agent.ActionCommand
    kind: enum
    variants:
      - name: open
        summary: The session was opened (`OpenSession`).
      - name: go
        summary: An address was requested (`Go`).
      - name: follow
        summary: A link of the page was followed (`Follow`).
      - name: fill
        summary: A control of the page was given a value (`Fill`).
      - name: pick
        summary: A choice of the page was changed (`Pick`).
      - name: press
        summary: A button of the page was pressed (`Press`).
      - name: back
        summary: The entry before the current one was requested (`GoBack`).
      - name: forward
        summary: The entry after the current one was requested (`GoForward`).
      - name: close
        summary: The session was closed (`CloseSession`).
    naming:
      summary: Which command of the agent an action was.

  # The token is a credential, not a name: whoever holds it drives the session, so it is distinct
  # from `SessionId`. Its form is 32 bytes from the operating system's random source, written as
  # 64 lower-case hexadecimal digits. It is not declared as an `alphabet:` or a length: the
  # command-line binding refuses a constrained type ("invariants are explicit refusals",
  # ess-cli/2), so the form is checked by the code that issues and reads it.
  # It is named only by the nine command-line shapes below that carry it (`SessionCall`,
  # `LookCall`, `GoCall`, `FollowCall`, `FillCall`, `PickCall`, `PressCall`, `LogCall`,
  # `OpenedSession`): no entity, command, event or view holds it, so no stored row and no
  # published event carries the secret.
  # UNMAPPED: that a session's token is what makes its caller `surf.agent.SessionHolder`. The
  # session process issues the token when it opens its session, keeps only a hash of it, compares
  # a presented token with it in constant time, and sends the call as `SessionHolder` with that
  # `session_id`; the model says only "the caller's credential carries session S". `OpenSession`
  # does not answer the token: marked `one_time_response`, it makes ess 0.96.0 refuse Rust code
  # for every component ("one_time_response requires implementation-owned atomic durable
  # consumption and fresh issuance; this code target cannot implement that policy",
  # docs/plan/agent-cli-draft-1.md). What would settle it: an ESS construct naming an issued value
  # as the credential of an actor, which a code target can implement.
  - name: surf.agent.SessionToken
    kind: newtype
    of: String
    naming:
      summary: The secret an agent presents to act on its session, 64 lower-case hexadecimal digits.

  # The shapes the command-line binding `cli/surf-agent.yaml` reads and answers. An `ess-cli/2`
  # callable names a declared struct as its input and a declared type as its result; a command's
  # input, a command's response and a view's row are not types it can name. They add no meaning:
  # each mirrors the command or view the callable maps to, plus the token the call presents.
  # `session_id` is `String` in each, not `SessionId`: the binding refuses a `Uuid` underneath
  # ("unsupported CLI primitive `Uuid`", ess 0.96.0), so the client parses the text into the
  # identity and answers a malformed one as an invalid input.
  # How `--as` prints the page a call loaded or shows (`docs/design/page-as-text.md`, section 2):
  # the outline of its node tree or its text as Markdown, in the `text` block of the answer.
  # `as` is a Rust keyword, so the fields that carry it are named `form`.
  - name: surf.agent.PageForm
    kind: enum
    variants:
      - name: tree
        summary: The outline of the page's node tree, one line per element and text.
      - name: markdown
        summary: The page's text as Markdown, with its links and controls named by their handles.
    naming:
      summary: The form in which an answer prints the page.

  # `form` and `from_line` are two fields on each of `OpenCall`, `GoCall` and `LookCall`, not one
  # shared record: an `ess-cli/2` argument binds a field of the callable's input by name, and a
  # field inside a nested record is not a source the binding is measured to take. `from_line`
  # counts the lines of the form asked for, from 1; the client takes it only beside `form`.
  - name: surf.agent.OpenCall
    kind: struct
    naming:
      summary: The input of `open`, the address to load first if one is given, and the form to print it in.
    fields:
      - name: url
        type: Optional<surf.url.Url>
      - name: form
        type: Optional<surf.agent.PageForm>
      - name: from_line
        type: Optional<Integer>

  - name: surf.agent.LookCall
    kind: struct
    naming:
      summary: Which session `look` reads, the token that proves the caller holds it, and the form to print the page in.
    fields:
      - name: session_id
        type: String
      - name: token
        type: surf.agent.SessionToken
      - name: form
        type: Optional<surf.agent.PageForm>
      - name: from_line
        type: Optional<Integer>

  - name: surf.agent.SessionCall
    kind: struct
    naming:
      summary: Which session a call acts on, and the token that proves the caller holds it.
    fields:
      - name: session_id
        type: String
      - name: token
        type: surf.agent.SessionToken

  - name: surf.agent.GoCall
    kind: struct
    naming:
      summary: The address to load into a session, the token that proves the caller holds it, and the form to print the page in.
    fields:
      - name: session_id
        type: String
      - name: token
        type: surf.agent.SessionToken
      - name: url
        type: surf.url.Url
      - name: form
        type: Optional<surf.agent.PageForm>
      - name: from_line
        type: Optional<Integer>

  # `handle` is a word the session gave in a `now` line (`l4`); the session process holds the map
  # from handle to element, so the shape carries the word as typed.
  - name: surf.agent.FollowCall
    kind: struct
    naming:
      summary: The handle of the link to follow in a session, and the token that proves the caller holds it.
    fields:
      - name: session_id
        type: String
      - name: token
        type: surf.agent.SessionToken
      - name: handle
        type: String

  # `fill <handle> <value>` (`story:agent-fill-pick`). The value is the word as typed, or `-`,
  # which the client replaces by what it reads from standard input before it sends the call: a
  # secret is never an argument word, which every local user can read.
  # UNMAPPED: `-` as the value word. `ess-cli/2` has no source that reads standard input for a
  # field that is not `protected`, and a `protected` source declares a token file and a prompt
  # that a value has no use for. What would settle it: a positional source in ESS that may read
  # standard input.
  - name: surf.agent.FillCall
    kind: struct
    naming:
      summary: The handle of the control to fill in a session, its value, and the token that proves the caller holds it.
    fields:
      - name: session_id
        type: String
      - name: token
        type: surf.agent.SessionToken
      - name: handle
        type: String
      - name: value
        type: String

  # `pick <handle> <option>`: an option of a select by its label, then its value; `on` or `off`
  # for a checkbox; `on` for a radio button.
  - name: surf.agent.PickCall
    kind: struct
    naming:
      summary: The handle of the choice to change in a session, the option to pick, and the token that proves the caller holds it.
    fields:
      - name: session_id
        type: String
      - name: token
        type: surf.agent.SessionToken
      - name: handle
        type: String
      - name: option
        type: String

  # `press <handle>` (`story:agent-press-submit`): the handle of a submit button of the `now`
  # block, as `FollowCall` carries a link's.
  - name: surf.agent.PressCall
    kind: struct
    naming:
      summary: The handle of the button to press in a session, and the token that proves the caller holds it.
    fields:
      - name: session_id
        type: String
      - name: token
        type: surf.agent.SessionToken
      - name: handle
        type: String

  # `log [<n>]` (`story:agent-change-and-log`): every action of the session from the view
  # `SessionLog`, or the last `count` of them. A read: it records no action.
  - name: surf.agent.LogCall
    kind: struct
    naming:
      summary: Which session `log` reads, how many of its last actions to list if not all, and the token that proves the caller holds it.
    fields:
      - name: session_id
        type: String
      - name: token
        type: surf.agent.SessionToken
      - name: count
        type: Optional<Integer>

  - name: surf.agent.OpenedSession
    kind: struct
    naming:
      summary: The answer of `open`; the only answer that carries the token.
    fields:
      - name: session_id
        type: String
      - name: token
        type: surf.agent.SessionToken

  - name: surf.agent.SessionReadout
    kind: struct
    naming:
      summary: A row of `SessionState`, as every call but `open` answers it.
    fields:
      - name: session_id
        type: String
      - name: state
        type: surf.agent.Session.State
      - name: url
        type: Optional<surf.url.Url>
      - name: navigation_state
        type: Optional<surf.navigation.Navigation.State>
      - name: status
        type: Optional<surf.net.Status>
      - name: media_type
        type: Optional<surf.net.MediaType>
      - name: failure_reason
        type: Optional<surf.net.FailureReason>

entities:
  - name: surf.agent.Session
    naming:
      summary: One agent's session, holding one tab in one window of its own.
    identity:
      name: session_id
      type: surf.agent.SessionId
    fields:
      # The window and the tab are held by the shell component. This component stores their
      # identities and reads nothing of them, as `surf.navigation.Navigation` stores its tab.
      - name: window_id
        type: surf.shell.WindowId
      - name: tab_id
        type: surf.shell.TabId
      # The session a caller's credential must carry to act on this one: its own identity, which
      # `OpenSession` copies here. The holder check compares it with the caller in `when_subject:`,
      # because a guard over the stored row cannot read the row's identity (`ESS-COMMAND-003`,
      # `unobservable_fact`). Compared with the input instead (`when: session_id !=
      # caller.session_id`), synthesis sends the acts that arrange a Closed session as a caller
      # that is not its holder, and three of its scenarios fail against the interpreter
      # (`Go/outcome/closed`, `Session/state/Closed/refuses/{Go,CloseSession}`, ess 0.96.0).
      - name: holder
        type: surf.agent.SessionId
      # What the agent reads back about its current navigation. The navigator holds the
      # navigation; this component reads none of its rows and keeps the copy its events report
      # (`NoteNavigationStarted` and the three commands that note its end). All three are absent
      # until the first navigation of the session started. `url` is the address asked for until
      # the navigation commits, then the response's, after the last redirect
      # (`NoteNavigationCommitted`).
      - name: navigation_id
        type: Optional<surf.net.RequestId>
      - name: url
        type: Optional<surf.url.Url>
      - name: navigation_state
        type: Optional<surf.navigation.Navigation.State>
      # The rest of the `page` line (design section 5.1): the status and media type of a
      # committed navigation, the reason of a failed one. `NoteNavigationStarted` clears all
      # three; `NoteNavigationCommitted` sets the first two, `NoteNavigationFailed` the third.
      - name: status
        type: Optional<surf.net.Status>
      - name: media_type
        type: Optional<surf.net.MediaType>
      - name: failure_reason
        type: Optional<surf.net.FailureReason>
    relations:
      # The shell holds the window. A closed session leaves it Open: nothing closes a window yet.
      # UNMAPPED: closing the session's window with the session. What would settle it: a command
      # that closes a window (`story:agent-close-window`).
      - name: window
        kind: references
        target: surf.shell.Window
        cardinality: one
        via: window_id
      # UNMAPPED: one tab for the life of the session. What happens when a page opens another tab
      # or window (a later slice, with script and links) is not said, so `cardinality: many` is
      # not written. What would settle it: the slice that lets a page open a tab. The answer taken
      # until then: one tab.
      - name: tab
        kind: references
        target: surf.shell.Tab
        cardinality: one
        via: tab_id
      - name: navigation
        kind: references
        target: surf.navigation.Navigation
        cardinality: one
        via: navigation_id
      # Declared because `holder` is typed as this entity's identity (`ESS-ENTITY-019`): it names
      # the session itself.
      - name: holder
        kind: references
        target: surf.agent.Session
        cardinality: one
        via: holder
      # The session's action log (design section 6, accepted with the design): zero actions
      # before the first, and an action never outlives its session.
      - name: actions
        kind: owns
        target: surf.agent.Action
        cardinality: many
        via: session_id
      # UNMAPPED: the session's document. A document carries the navigation it was parsed for
      # (`surf.document.Document.navigation_id`, in `Documents` and `DocumentParsed`), and this
      # component stores no document: the session process finds the current one in `Documents` by
      # the session's `navigation_id`. What would settle it: the first command of this component
      # that needs the document (`story:agent-follow-links`).
    lifecycle:
      initial: Open
      states:
        - name: Open
          summary: The agent may act on it.
        - name: Closed
          summary: The agent closed it; it accepts nothing more and its token acts on nothing.
      terminal: [Closed]
      transitions:
        - name: close
          from: [Open]
          to: Closed

  # One accepted action of a session: a row of its log, which the `path` line and `log` print
  # (design sections 5.1 and 6). A refused command records nothing, so every row was accepted;
  # what came of it is the state of the navigation, which the session shows on the `page` line,
  # so the design's "outcome" is not stored a second time.
  # The value the agent gave is stored as the specification types it, never as text the session
  # process rendered: `url` is the address of `go` and `follow`, absent for the others. A control's
  # value is never stored: `fill` is recorded with its handle alone, so a password the agent typed
  # stays out of the log.
  - name: surf.agent.Action
    naming:
      summary: One accepted action of a session, in the order the session took them.
    identity:
      name: action_id
      type: surf.agent.ActionId
    fields:
      - name: session_id
        type: surf.agent.SessionId
      - name: sequence
        type: Integer
      - name: command
        type: surf.agent.ActionCommand
      - name: url
        type: Optional<surf.url.Url>
      # The handle of the element a `follow`, `fill`, `pick` or `press` acted on (`l4`, `f1`), and
      # a `follow`'s link label as the page wrote it, for the `path` line (`2 follow l4 "Sign
      # in"`, `3 fill f1`, design section 5.1); absent for every other command.
      - name: handle
        type: Optional<String>
      - name: label
        type: Optional<String>
    lifecycle:
      initial: Recorded
      states:
        - name: Recorded
          summary: The action was taken; a row of the log never changes.
      terminal: [Recorded]

# Two callers. Whoever can reach the session directory opens a session; afterwards only a caller
# whose credential carries the session acts on it. An actor's `attributes:` are what its
# credential carries and the credential is their authority, not the request (ess/16,
# website/docs/guides/specify/values-and-views.md, "Read the caller's credential"). A command
# compares the attribute with the session it addresses. What makes a credential carry a session
# is the token, which the session process checks (the marker at the token's type above).
# Who may open a session: whoever can reach the session directory, which only the local user can
# read (`docs/design/agent-interface.md`, section 3); no further check applies.
actors:
  - name: surf.agent.Opener
    may:
      - surf.agent.OpenSession
      - surf.agent.Sessions
    naming:
      display: Opener
      summary: Whoever can reach the session directory; it has no session yet.

  - name: surf.agent.SessionHolder
    attributes:
      - name: session_id
        type: surf.agent.SessionId
    may:
      - surf.agent.Go
      - surf.agent.Follow
      - surf.agent.Fill
      - surf.agent.Pick
      - surf.agent.Press
      - surf.agent.GoBack
      - surf.agent.GoForward
      - surf.agent.CloseSession
      - surf.agent.SessionState
      - surf.agent.SessionLog
    naming:
      display: Session holder
      summary: An agent that presented the token of one session.

errors:
  - name: surf.agent.SessionNotFound
    summary: No session has this identity.
    fields:
      - name: session_id
        type: surf.agent.SessionId

  - name: surf.agent.SessionExists
    summary: A session already has this identity, so nothing moved.
    fields:
      - name: session_id
        type: surf.agent.SessionId

  - name: surf.agent.NotSessionHolder
    summary: The caller's token is not this session's, so nothing moved.
    fields:
      - name: session_id
        type: surf.agent.SessionId

  - name: surf.agent.SessionStateConflict
    summary: The session is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: surf.agent.Session.State

commands:
  # The caller chooses the session's identity, as `surf.net.Fetch` takes its `request_id`: `open`
  # draws it and the session process sends it here. An identity the target minted at run time
  # could not be named by a conformance suite, whose caller values are fixed when it is written.
  # The window and the tab come first: the session process issues `surf.shell.OpenWindow`, then
  # `surf.shell.OpenTab`, then this command, outside any binding, because those two mint their
  # identities and no binding carries a value back to the event that caused it. A caller-chosen
  # `tab_id` on `OpenTab` is a story of its own (`story:agent-open-tab-caller-id`).
  # Nothing is answered: the token is the session process's (the marker at the token's type).
  - name: surf.agent.OpenSession
    naming:
      wire: open-session
      display: Open a session
      summary: Open a session over a window and tab of its own.
    input:
      - name: session_id
        type: surf.agent.SessionId
      - name: window_id
        type: surf.shell.WindowId
      - name: tab_id
        type: surf.shell.TabId
    outcomes:
      - name: opened
        creates: surf.agent.Session
        instance: session_id
        sets:
          window_id: input.window_id
          tab_id: input.tab_id
          holder: input.session_id
        emits:
          - surf.agent.SessionOpened
        payload:
          surf.agent.SessionOpened:
            session_id: input.session_id
            window_id: input.window_id
            tab_id: input.tab_id
        summary: The session is Open.

      - name: exists
        existing_instance: true
        error: surf.agent.SessionExists
        payload:
          surf.agent.SessionExists:
            session_id: input.session_id
        summary: A session already has this identity; it is unchanged.

  # Going to an address is asking the navigator for it: the session's fields change only when the
  # navigation the request starts is reported back through `NoteNavigationStarted`. The accepting
  # branch is an `updates:` that sets nothing, because a `preserves:` branch may not publish an
  # event (`ESS-COMMAND-004`, "a preserving outcome declares no assignment, event or error").
  # The holder check reads the session's `holder` (see that field). It answers after the session
  # is looked up, so a caller holding another session's token learns whether this one exists,
  # which `Sessions` tells every opener anyway, and nothing of its state.
  - name: surf.agent.Go
    naming:
      wire: go
      display: Go to an address
      summary: Start loading an address into the session's tab.
    input:
      - name: session_id
        type: surf.agent.SessionId
      - name: url
        type: surf.url.Url
        example: "http://example.org/"
    outcomes:
      - name: not-holder
        when_subject: {predicate: holder != caller.session_id}
        error: surf.agent.NotSessionHolder
        payload:
          surf.agent.NotSessionHolder:
            session_id: input.session_id
        summary: The caller's token is another session's.

      - name: no-such-session
        unknown_instance: true
        error: surf.agent.SessionNotFound
        payload:
          surf.agent.SessionNotFound:
            session_id: input.session_id
        summary: No session has this identity.

      - name: closed
        when_subject_state: Closed
        error: surf.agent.SessionStateConflict
        payload:
          surf.agent.SessionStateConflict:
            state: {subject: state}
        summary: The session is Closed; nothing was requested.

      - name: requested
        updates: surf.agent.Session
        instance: session_id
        emits:
          - surf.agent.NavigationRequested
        payload:
          surf.agent.NavigationRequested:
            session_id: input.session_id
            tab_id: {subject: tab_id}
            url: input.url
            handle: {generated: true}
            label: {generated: true}
        summary: The navigator is asked to load the address into the session's tab.

  # `follow <handle>` (design section 4, step 3 of section 9). Handles are not modelled: a handle
  # is a name inside one session, assigned in document order by the session process, which holds
  # the map from handle to element and resolves the link's target with `surf-url`
  # (`agent-follow-links`). So `Follow` takes the resolved address, and the handle and the label
  # for the action the session then records (`RecordAction` with `command: follow`, as `go` is
  # recorded after `Go`, decision D19); it reads nothing of the node tree. Its outcomes are
  # `Go`'s, and an accepted one emits `NavigationRequested`, which navigates with `Get` and no
  # body (`navigate-on-navigation-requested`) and carries the handle and the label.
  - name: surf.agent.Follow
    naming:
      wire: follow
      display: Follow a link
      summary: Start loading a link's target into the session's tab.
    input:
      - name: session_id
        type: surf.agent.SessionId
      - name: url
        type: surf.url.Url
        example: "http://example.org/offers"
      - name: handle
        type: String
        example: "l1"
      - name: label
        type: String
        example: "Offers"
    outcomes:
      - name: not-holder
        when_subject: {predicate: holder != caller.session_id}
        error: surf.agent.NotSessionHolder
        payload:
          surf.agent.NotSessionHolder:
            session_id: input.session_id
        summary: The caller's token is another session's.

      - name: no-such-session
        unknown_instance: true
        error: surf.agent.SessionNotFound
        payload:
          surf.agent.SessionNotFound:
            session_id: input.session_id
        summary: No session has this identity.

      - name: closed
        when_subject_state: Closed
        error: surf.agent.SessionStateConflict
        payload:
          surf.agent.SessionStateConflict:
            state: {subject: state}
        summary: The session is Closed; nothing was requested.

      - name: requested
        updates: surf.agent.Session
        instance: session_id
        emits:
          - surf.agent.NavigationRequested
        payload:
          surf.agent.NavigationRequested:
            session_id: input.session_id
            tab_id: {subject: tab_id}
            url: input.url
            handle: input.handle
            label: input.label
        summary: The navigator is asked to load the link's target into the session's tab.

  # `fill <handle> <text>`, `pick <handle> [<option>]` and `press <handle>` (design section 4, step
  # 4 of section 9). As for `Follow`, handles are not modelled: the session process resolves the
  # handle to the element's identity, and `pick`'s option word to the identity of an option of the
  # select, from the rows of `surf.document`, and records the action after an accepted command
  # (`RecordAction`) with the handle and never the value. Each is refused as `Go` is. An accepted
  # one publishes a request that a binding maps onto the `document` component's command
  # (`spec/components.yaml`): this component reads no element row, so whether the element exists
  # and takes the action is that command's answer. The request carries the handle too.
  # The value of `fill` travels in `FillRequested` to `surf.document.SetValue`, so an event of this
  # component carries what the agent typed, a password included. The session's entries
  # (`docs/view-stream.md`) write its length, never the value; no row of this component stores it.
  - name: surf.agent.Fill
    naming:
      wire: fill
      display: Fill a control
      summary: Give a text control of the session's page a value.
    input:
      - name: session_id
        type: surf.agent.SessionId
      - name: element_id
        type: surf.document.ElementId
      - name: value
        type: String
        example: "ada"
      - name: handle
        type: String
        example: "f1"
    outcomes:
      - name: not-holder
        when_subject: {predicate: holder != caller.session_id}
        error: surf.agent.NotSessionHolder
        payload:
          surf.agent.NotSessionHolder:
            session_id: input.session_id
        summary: The caller's token is another session's.

      - name: no-such-session
        unknown_instance: true
        error: surf.agent.SessionNotFound
        payload:
          surf.agent.SessionNotFound:
            session_id: input.session_id
        summary: No session has this identity.

      - name: closed
        when_subject_state: Closed
        error: surf.agent.SessionStateConflict
        payload:
          surf.agent.SessionStateConflict:
            state: {subject: state}
        summary: The session is Closed; nothing was requested.

      - name: requested
        updates: surf.agent.Session
        instance: session_id
        emits:
          - surf.agent.FillRequested
        payload:
          surf.agent.FillRequested:
            session_id: input.session_id
            element_id: input.element_id
            value: input.value
            handle: input.handle
        summary: The document is asked to give the control the value.

  # `pick` without an option activates a checkbox or a radio button (`surf.document.Check`); with
  # one it selects that option of a select (`surf.document.SelectOption`). Which of the two the
  # request goes to is the binding's condition on `option_id`.
  - name: surf.agent.Pick
    naming:
      wire: pick
      display: Pick a choice
      summary: Toggle a checkbox, check a radio button or select an option of the session's page.
    input:
      - name: session_id
        type: surf.agent.SessionId
      - name: element_id
        type: surf.document.ElementId
      - name: option_id
        type: Optional<surf.document.OptionId>
      - name: handle
        type: String
        example: "f3"
    outcomes:
      - name: not-holder
        when_subject: {predicate: holder != caller.session_id}
        error: surf.agent.NotSessionHolder
        payload:
          surf.agent.NotSessionHolder:
            session_id: input.session_id
        summary: The caller's token is another session's.

      - name: no-such-session
        unknown_instance: true
        error: surf.agent.SessionNotFound
        payload:
          surf.agent.SessionNotFound:
            session_id: input.session_id
        summary: No session has this identity.

      - name: closed
        when_subject_state: Closed
        error: surf.agent.SessionStateConflict
        payload:
          surf.agent.SessionStateConflict:
            state: {subject: state}
        summary: The session is Closed; nothing was requested.

      - name: requested
        updates: surf.agent.Session
        instance: session_id
        emits:
          - surf.agent.PickRequested
        payload:
          surf.agent.PickRequested:
            session_id: input.session_id
            element_id: input.element_id
            option_id: input.option_id
            handle: input.handle
        summary: The document is asked to change the control's choice.

  - name: surf.agent.Press
    naming:
      wire: press
      display: Press a button
      summary: Activate a button of the session's page, which submits its form.
    input:
      - name: session_id
        type: surf.agent.SessionId
      - name: element_id
        type: surf.document.ElementId
      - name: handle
        type: String
        example: "b1"
    outcomes:
      - name: not-holder
        when_subject: {predicate: holder != caller.session_id}
        error: surf.agent.NotSessionHolder
        payload:
          surf.agent.NotSessionHolder:
            session_id: input.session_id
        summary: The caller's token is another session's.

      - name: no-such-session
        unknown_instance: true
        error: surf.agent.SessionNotFound
        payload:
          surf.agent.SessionNotFound:
            session_id: input.session_id
        summary: No session has this identity.

      - name: closed
        when_subject_state: Closed
        error: surf.agent.SessionStateConflict
        payload:
          surf.agent.SessionStateConflict:
            state: {subject: state}
        summary: The session is Closed; nothing was requested.

      - name: requested
        updates: surf.agent.Session
        instance: session_id
        emits:
          - surf.agent.PressRequested
        payload:
          surf.agent.PressRequested:
            session_id: input.session_id
            element_id: input.element_id
            handle: input.handle
        summary: The document is asked to activate the button.

  # `back` and `forward` (design section 4): the navigator is asked to traverse the session's tab
  # by one step, through `TraversalRequested` and the binding `traverse-on-traversal-requested`.
  # Each is refused as `Go` is. Whether the tab has an entry there, and whether it may be loaded
  # again, is the navigator's answer (`surf.navigation.TraverseHistory`): this component reads no
  # history row, so an accepted `GoBack` may start nothing, which the session then shows as the
  # navigation it had.
  - name: surf.agent.GoBack
    naming:
      wire: go-back
      display: Go back
      summary: Ask for the entry before the current one in the session's tab.
    input:
      - name: session_id
        type: surf.agent.SessionId
    outcomes:
      - name: not-holder
        when_subject: {predicate: holder != caller.session_id}
        error: surf.agent.NotSessionHolder
        payload:
          surf.agent.NotSessionHolder:
            session_id: input.session_id
        summary: The caller's token is another session's.

      - name: no-such-session
        unknown_instance: true
        error: surf.agent.SessionNotFound
        payload:
          surf.agent.SessionNotFound:
            session_id: input.session_id
        summary: No session has this identity.

      - name: closed
        when_subject_state: Closed
        error: surf.agent.SessionStateConflict
        payload:
          surf.agent.SessionStateConflict:
            state: {subject: state}
        summary: The session is Closed; nothing was requested.

      - name: requested
        updates: surf.agent.Session
        instance: session_id
        emits:
          - surf.agent.TraversalRequested
        payload:
          surf.agent.TraversalRequested:
            session_id: input.session_id
            tab_id: {subject: tab_id}
            step: back
        summary: The navigator is asked for the entry before the current one.

  - name: surf.agent.GoForward
    naming:
      wire: go-forward
      display: Go forward
      summary: Ask for the entry after the current one in the session's tab.
    input:
      - name: session_id
        type: surf.agent.SessionId
    outcomes:
      - name: not-holder
        when_subject: {predicate: holder != caller.session_id}
        error: surf.agent.NotSessionHolder
        payload:
          surf.agent.NotSessionHolder:
            session_id: input.session_id
        summary: The caller's token is another session's.

      - name: no-such-session
        unknown_instance: true
        error: surf.agent.SessionNotFound
        payload:
          surf.agent.SessionNotFound:
            session_id: input.session_id
        summary: No session has this identity.

      - name: closed
        when_subject_state: Closed
        error: surf.agent.SessionStateConflict
        payload:
          surf.agent.SessionStateConflict:
            state: {subject: state}
        summary: The session is Closed; nothing was requested.

      - name: requested
        updates: surf.agent.Session
        instance: session_id
        emits:
          - surf.agent.TraversalRequested
        payload:
          surf.agent.TraversalRequested:
            session_id: input.session_id
            tab_id: {subject: tab_id}
            step: forward
        summary: The navigator is asked for the entry after the current one.

  # The next four commands are the agent component's side of the navigator's events: the bindings
  # `note-on-navigation-*` invoke them, and no actor is granted them. A navigation event names its
  # tab and its navigation and no session, so each command changes every session its filter
  # selects (`instances:`, ess/16, website/docs/guides/specify/selection-effects.md): at most one,
  # because a session holds its tab alone. A navigation in a tab no session holds selects none,
  # which is an accepted answer.
  - name: surf.agent.NoteNavigationStarted
    naming:
      wire: note-navigation-started
      display: Note a started navigation
      summary: Record on the session holding the tab that a navigation started in it.
    input:
      - name: tab_id
        type: surf.shell.TabId
      - name: navigation_id
        type: surf.net.RequestId
      - name: url
        type: surf.url.Url
    outcomes:
      - name: noted
        updates: surf.agent.Session
        instances: {where: tab_id == input.tab_id}
        sets:
          navigation_id: input.navigation_id
          url: input.url
          navigation_state: Started
          status: {cleared: true}
          media_type: {cleared: true}
          failure_reason: {cleared: true}
        emits:
          - surf.agent.SessionNavigationChanged
        payload:
          surf.agent.SessionNavigationChanged:
            navigation_id: input.navigation_id
            state: Started
            sessions: {count: changed}
        summary: The session holding the tab, if any, shows the navigation as Started.

  # The three commands that note a navigation's end are selected by the navigation, not the tab: a
  # navigation that ends after a newer one started in the same tab changes nothing.
  # A committed and a failed navigation each have a command of their own, because each carries
  # what the other does not. One command with `Optional` inputs validates and runs on the
  # interpreter, but ess 0.96.0 refuses Rust for a binding that maps a required event field into
  # an `Optional` input ("emits a plain clone of `surf.net.Status` for `status` of type
  # `Optional<surf.net.Status>`; this assignment needs an explicit target representation").
  # `NoteNavigationEnded` keeps the cancelled end, which carries nothing more.
  - name: surf.agent.NoteNavigationCommitted
    naming:
      wire: note-navigation-committed
      display: Note a committed navigation
      summary: Record on the session showing a navigation that it committed, with its address, status and media type.
    input:
      - name: navigation_id
        type: surf.net.RequestId
      # The address the navigation committed at: the response's, after the last redirect. It
      # replaces the address the session showed since the navigation started.
      - name: url
        type: surf.url.Url
      - name: status
        type: surf.net.Status
      - name: media_type
        type: surf.net.MediaType
    outcomes:
      - name: noted
        updates: surf.agent.Session
        instances: {where: navigation_id == input.navigation_id}
        sets:
          url: input.url
          navigation_state: Committed
          status: input.status
          media_type: input.media_type
        emits:
          - surf.agent.SessionNavigationChanged
        payload:
          surf.agent.SessionNavigationChanged:
            navigation_id: input.navigation_id
            state: Committed
            sessions: {count: changed}
        summary: The session showing the navigation, if any, shows it Committed at its address with its status and media type.

  - name: surf.agent.NoteNavigationFailed
    naming:
      wire: note-navigation-failed
      display: Note a failed navigation
      summary: Record on the session showing a navigation that it failed, and why.
    input:
      - name: navigation_id
        type: surf.net.RequestId
      - name: reason
        type: surf.net.FailureReason
    outcomes:
      - name: noted
        updates: surf.agent.Session
        instances: {where: navigation_id == input.navigation_id}
        sets:
          navigation_state: Failed
          failure_reason: input.reason
        emits:
          - surf.agent.SessionNavigationChanged
        payload:
          surf.agent.SessionNavigationChanged:
            navigation_id: input.navigation_id
            state: Failed
            sessions: {count: changed}
        summary: The session showing the navigation, if any, shows it Failed with its reason.

  - name: surf.agent.NoteNavigationEnded
    naming:
      wire: note-navigation-ended
      display: Note an ended navigation
      summary: Record on the session showing a navigation how the navigation ended.
    input:
      - name: navigation_id
        type: surf.net.RequestId
      - name: state
        type: surf.navigation.Navigation.State
    outcomes:
      - name: noted
        updates: surf.agent.Session
        instances: {where: navigation_id == input.navigation_id}
        sets:
          navigation_state: input.state
        emits:
          - surf.agent.SessionNavigationChanged
        payload:
          surf.agent.SessionNavigationChanged:
            navigation_id: input.navigation_id
            state: input.state
            sessions: {count: changed}
        summary: The session showing the navigation, if any, shows the state it ended in.

  # The holder check is the one of `Go`.
  - name: surf.agent.CloseSession
    naming:
      wire: close-session
      display: Close a session
      summary: Close a session and the tab it holds.
    input:
      - name: session_id
        type: surf.agent.SessionId
    outcomes:
      - name: not-holder
        when_subject: {predicate: holder != caller.session_id}
        error: surf.agent.NotSessionHolder
        payload:
          surf.agent.NotSessionHolder:
            session_id: input.session_id
        summary: The caller's token is another session's.

      - name: no-such-session
        unknown_instance: true
        error: surf.agent.SessionNotFound
        payload:
          surf.agent.SessionNotFound:
            session_id: input.session_id
        summary: No session has this identity.

      - name: closed
        moves: surf.agent.Session.close
        instance: session_id
        emits:
          - surf.agent.SessionClosed
        payload:
          surf.agent.SessionClosed:
            session_id: input.session_id
            window_id: {subject: window_id}
            tab_id: {subject: tab_id}
        summary: The session is Closed and its tab is to be closed.

      - name: wrong-state
        wrong_state: true
        error: surf.agent.SessionStateConflict
        payload:
          surf.agent.SessionStateConflict:
            state: {subject: state}
        summary: The session was already Closed.

  # The session process records each action it took, after the agent's command was accepted and
  # before it answers: `OpenSession/opened` records `open`, `Go/requested` records `go` with its
  # address, `Follow/requested` records `follow` with its address, handle and label,
  # `Fill/requested`, `Pick/requested` and `Press/requested` record `fill`, `pick` and `press` with
  # the handle, `GoBack/requested` and `GoForward/requested` record `back` and `forward` with
  # nothing more, `CloseSession/closed` records `close`. `open <url>` is two actions, `open` and then
  # `go` with the address, because it is `OpenSession` and then `Go` (design section 4). The
  # session process holds one session and is the only writer of its log, so it supplies the
  # sequence number, from 1. A refused command records nothing. No actor is granted it: like
  # `surf.net.DeliverResponse`, it is the component's own step.
  - name: surf.agent.RecordAction
    naming:
      wire: record-action
      display: Record an action
      summary: Add an accepted action to its session's log.
    input:
      - name: session_id
        type: surf.agent.SessionId
      - name: sequence
        type: Integer
      - name: command
        type: surf.agent.ActionCommand
      - name: url
        type: Optional<surf.url.Url>
      - name: handle
        type: Optional<String>
      - name: label
        type: Optional<String>
    outcomes:
      # An action belongs to a session (`Session.actions`, `owns`), so one for a session that does
      # not exist is refused.
      - name: no-such-session
        when_related: {via: input.session_id, exists: false}
        error: surf.agent.SessionNotFound
        payload:
          surf.agent.SessionNotFound:
            session_id: input.session_id
        summary: No session has this identity; nothing is recorded.

      - name: recorded
        creates: surf.agent.Action
        instance: action_id
        sets:
          session_id: input.session_id
          sequence: input.sequence
          command: input.command
          url: input.url
          handle: input.handle
          label: input.label
        emits:
          - surf.agent.ActionRecorded
        payload:
          surf.agent.ActionRecorded:
            action_id: {generated: true}
            session_id: input.session_id
            sequence: input.sequence
            command: input.command
            url: input.url
            handle: input.handle
            label: input.label
        summary: The action is a row of its session's log.

events:
  - name: surf.agent.SessionOpened
    fields:
      - name: session_id
        type: surf.agent.SessionId
      - name: window_id
        type: surf.shell.WindowId
      - name: tab_id
        type: surf.shell.TabId

  # `handle` and `label` are `Follow`'s inputs, the link's handle and its label as the page wrote
  # it; a `Go` sets neither. They carry what the session records for the action toward the
  # record (`RecordAction`); no binding reads them. ess 0.97.3 has no payload spelling for an
  # absent `Optional` event field: `Go` declares both `{generated: true}`, which lets the
  # implementation leave them absent, and the agent's ports answer absent.
  - name: surf.agent.NavigationRequested
    fields:
      - name: session_id
        type: surf.agent.SessionId
      - name: tab_id
        type: surf.shell.TabId
      - name: url
        type: surf.url.Url
      - name: handle
        type: Optional<String>
      - name: label
        type: Optional<String>

  # `step` is `back` for `GoBack` and `forward` for `GoForward`, the navigator's own type for where
  # an entry stands from the current one.
  - name: surf.agent.TraversalRequested
    fields:
      - name: session_id
        type: surf.agent.SessionId
      - name: tab_id
        type: surf.shell.TabId
      - name: step
        type: surf.navigation.Standing

  # ESS refuses an outcome that publishes nothing (`ESS-COMMAND-007`, `empty_change`); this is
  # what the four note commands publish. `sessions` is how many sessions changed: 0 for a
  # navigation in a tab no session holds.
  - name: surf.agent.SessionNavigationChanged
    fields:
      - name: navigation_id
        type: surf.net.RequestId
      - name: state
        type: surf.navigation.Navigation.State
      - name: sessions
        type: Integer

  - name: surf.agent.SessionClosed
    fields:
      - name: session_id
        type: surf.agent.SessionId
      - name: window_id
        type: surf.shell.WindowId
      - name: tab_id
        type: surf.shell.TabId

  - name: surf.agent.ActionRecorded
    fields:
      - name: action_id
        type: surf.agent.ActionId
      - name: session_id
        type: surf.agent.SessionId
      - name: sequence
        type: Integer
      - name: command
        type: surf.agent.ActionCommand
      - name: url
        type: Optional<surf.url.Url>
      - name: handle
        type: Optional<String>
      - name: label
        type: Optional<String>

  # `handle` in the next three is the command's input, the control's handle, carried toward the
  # record as `NavigationRequested`'s is; no binding reads it.
  - name: surf.agent.FillRequested
    fields:
      - name: session_id
        type: surf.agent.SessionId
      - name: element_id
        type: surf.document.ElementId
      - name: value
        type: String
      - name: handle
        type: Optional<String>

  - name: surf.agent.PickRequested
    fields:
      - name: session_id
        type: surf.agent.SessionId
      - name: element_id
        type: surf.document.ElementId
      - name: option_id
        type: Optional<surf.document.OptionId>
      - name: handle
        type: Optional<String>

  - name: surf.agent.PressRequested
    fields:
      - name: session_id
        type: surf.agent.SessionId
      - name: element_id
        type: surf.document.ElementId
      - name: handle
        type: Optional<String>

  # No command publishes it: the session process writes it into the entries of one request, after
  # an action's events, when it left `count` of them out to keep the entries within the link's
  # bounds (`crates/session/src/lib.rs`, "The entries"). It is declared here so that its name and
  # field are `spec/`'s, as every other event entry's are (`docs/view-stream.md`, "Event names").
  - name: surf.agent.EventsLeftOut
    fields:
      - name: count
        type: Integer

views:
  # Every session, as the local user lists them: every stored field but `holder`, which repeats
  # `session_id`. The token is not stored here at all.
  - name: surf.agent.Sessions
    source: surf.agent.Session
    consistency: read_your_writes
    fields:
      - name: session_id
        type: surf.agent.SessionId
      - name: state
        type: surf.agent.Session.State
      - name: window_id
        type: surf.shell.WindowId
      - name: tab_id
        type: surf.shell.TabId
      - name: navigation_id
        type: Optional<surf.net.RequestId>
      - name: url
        type: Optional<surf.url.Url>
      - name: navigation_state
        type: Optional<surf.navigation.Navigation.State>
      - name: status
        type: Optional<surf.net.Status>
      - name: media_type
        type: Optional<surf.net.MediaType>
      - name: failure_reason
        type: Optional<surf.net.FailureReason>
    naming:
      wire: sessions
      display: Sessions

  # The state an agent reads back for its session (`look`): the rows of the answer that slice 1
  # can fill. A view reads only its own component's rows (AGENTS.md); the navigation's address,
  # state, status, media type and failure reason are the copy the navigator's events left on the
  # session.
  # Only the holder reads it, and the model cannot say so: a view's read grant names actors, not
  # rows, and a filter reading a caller attribute (`session_id == caller.session_id`) is refused
  # (`ESS-VIEW-003`, "`caller.session_id` reads `caller`, which is not a declared observable
  # root", ess 0.96.0). So one session process serves one session and answers only for it.
  # UNMAPPED: the answer's other rows: links, controls, their handles and whether each is visible.
  # The document domain has no node tree yet. What would settle it: the slices of
  # `docs/design/agent-interface.md`, section 9, steps 2 to 7.
  - name: surf.agent.SessionState
    source: surf.agent.Session
    consistency: read_your_writes
    params:
      - name: session_id
        type: surf.agent.SessionId
    filter: session_id == param.session_id
    fields:
      - name: session_id
        type: surf.agent.SessionId
      - name: state
        type: surf.agent.Session.State
      - name: url
        type: Optional<surf.url.Url>
      - name: navigation_state
        type: Optional<surf.navigation.Navigation.State>
      - name: status
        type: Optional<surf.net.Status>
      - name: media_type
        type: Optional<surf.net.MediaType>
      - name: failure_reason
        type: Optional<surf.net.FailureReason>
    # `code:` because the Rust target names both this view and `Session.State` `SessionState`.
    naming:
      code: SessionStateView
      wire: session-state
      display: Session state

  # The log of one session (`path`, and `log` in a later story), oldest first. Read by the holder,
  # as `SessionState` is; the same marker holds: one session process serves one session.
  - name: surf.agent.SessionLog
    source: surf.agent.Action
    consistency: read_your_writes
    params:
      - name: session_id
        type: surf.agent.SessionId
    filter: session_id == param.session_id
    order_by: [sequence asc]
    fields:
      - name: action_id
        type: surf.agent.ActionId
      - name: session_id
        type: surf.agent.SessionId
      - name: sequence
        type: Integer
      - name: command
        type: surf.agent.ActionCommand
      - name: url
        type: Optional<surf.url.Url>
      - name: handle
        type: Optional<String>
      - name: label
        type: Optional<String>
    naming:
      wire: session-log
      display: Session log
