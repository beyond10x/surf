# Software decomposition. Every component holds its own state and reads no other component's
# rows. The bindings below are the only coupling between them. Types cross the boundaries
# unconverted: a component names another domain's type where it carries that domain's value.

# UNMAPPED: the isolation boundary. Every component is `reached_by: in_process`, which says its
# callers share its process. The goal is the strongest isolation available (a process, a sandbox
# or a micro VM per component, or per site inside one), and nothing here says which component
# runs in which, what crosses the boundary, or which component may reach the network or disk.
components:
  - component: shell
    summary: The windows and tabs the user sees and acts on.
    owns:
      domains:
        - surf.shell
    accepts:
      commands:
        - surf.shell.OpenWindow
        - surf.shell.OpenTab
        - surf.shell.CloseTab
    publishes:
      events:
        - surf.shell.WindowOpened
        - surf.shell.TabOpened
        - surf.shell.TabClosed
    reached_by: in_process

  - component: navigator
    summary: Decides what each tab loads, tracks every load to its end and keeps each tab's session history.
    owns:
      domains:
        - surf.navigation
    accepts:
      commands:
        - surf.navigation.Navigate
        - surf.navigation.CommitNavigation
        - surf.navigation.FailNavigation
        - surf.navigation.CancelNavigation
        - surf.navigation.TraverseHistory
        - surf.navigation.StartTraversal
    publishes:
      events:
        - surf.navigation.NavigationStarted
        - surf.navigation.NavigationCommitted
        - surf.navigation.NavigationFailed
        - surf.navigation.NavigationCancelled
        - surf.navigation.TraversalStarted
    reached_by: in_process

  - component: net
    summary: Fetches resources; the only component that talks to the network.
    owns:
      domains:
        - surf.net
        - surf.url
    accepts:
      commands:
        - surf.net.Fetch
        - surf.net.DeliverResponse
        - surf.net.FailRequest
    publishes:
      events:
        - surf.net.RequestStarted
        - surf.net.ResponseReceived
        - surf.net.FetchFailed
    reached_by: in_process

  - component: document
    summary: Parses response bodies into documents, holds the state of their controls and submits their forms.
    owns:
      domains:
        - surf.document
    accepts:
      commands:
        - surf.document.ParseDocument
        - surf.document.AddForm
        - surf.document.AddElement
        - surf.document.AddOption
        - surf.document.AddScriptEnd
        - surf.document.FinishParsing
        - surf.document.SetValue
        - surf.document.Check
        - surf.document.SelectOption
        - surf.document.StartSubmission
        - surf.document.SubmitForm
        - surf.document.AbandonSubmission
    publishes:
      events:
        - surf.document.ParsingStarted
        - surf.document.FormAdded
        - surf.document.ElementAdded
        - surf.document.OptionAdded
        - surf.document.ScriptEndAdded
        - surf.document.DocumentParsed
        - surf.document.ValueSet
        - surf.document.CheckednessSet
        - surf.document.OptionSelected
        - surf.document.SubmissionStarted
        - surf.document.FormSubmitted
        - surf.document.SubmissionAbandoned
    reached_by: in_process

  - component: renderer
    summary: Styles, lays out and paints a document into a frame.
    owns:
      domains:
        - surf.render
    accepts:
      commands:
        - surf.render.PaintFrame
    publishes:
      events:
        - surf.render.FramePainted
    reached_by: in_process

  # The agent's session. Its callers are AI agents at a command line; each call reaches the
  # session's own process (`docs/design/agent-interface.md`, section 3). The grammar an agent types
  # is the binding document `cli/surf-agent.yaml`, outside the specification inputs.
  - component: agent
    summary: The sessions an AI agent opens and drives from the command line.
    owns:
      domains:
        - surf.agent
    accepts:
      commands:
        - surf.agent.OpenSession
        - surf.agent.Go
        - surf.agent.Follow
        - surf.agent.Fill
        - surf.agent.Pick
        - surf.agent.Press
        - surf.agent.GoBack
        - surf.agent.GoForward
        - surf.agent.CloseSession
        - surf.agent.NoteNavigationStarted
        - surf.agent.NoteNavigationCommitted
        - surf.agent.NoteNavigationFailed
        - surf.agent.NoteNavigationEnded
        - surf.agent.RecordAction
    publishes:
      events:
        - surf.agent.SessionOpened
        - surf.agent.NavigationRequested
        - surf.agent.SessionNavigationChanged
        - surf.agent.SessionClosed
        - surf.agent.ActionRecorded
        - surf.agent.FillRequested
        - surf.agent.PickRequested
        - surf.agent.PressRequested
        - surf.agent.TraversalRequested
    reached_by: in_process

# The page load, as four reactions, a traversal's navigation as a fifth, and a form's submission
# as a sixth. Every binding is one
# attempt inside one process (`at_most_once`), and each says what is lost when its command does
# not run.
bindings:
  - id: fetch-on-navigation-started
    summary: A started navigation fetches its address.
    when:
      event: surf.navigation.NavigationStarted
    invoke:
      command: surf.net.Fetch
    mapping:
      request_id: event.navigation_id
      url: event.url
      method: event.method
      body: event.body
      body_type: event.body_type
      initiator: event.initiator
    delivery: at_most_once
    # Fetch refuses nothing. If it does not run at all, the navigation stays Started until the
    # user cancels it.
    on_failure: drop

  - id: commit-on-response
    summary: A response commits the navigation that asked for it, at the address the response came from.
    when:
      event: surf.net.ResponseReceived
    invoke:
      command: surf.navigation.CommitNavigation
    mapping:
      navigation_id: event.request_id
      url: event.url
      method: event.method
      status: event.status
      media_type: event.media_type
      body: event.body
    delivery: at_most_once
    # Dropped on purpose: a response for a navigation that was cancelled, or for a request no
    # navigation issued, changes nothing.
    on_failure: drop

  - id: fail-on-fetch-failed
    summary: A fetch without a response fails the navigation that asked for it.
    when:
      event: surf.net.FetchFailed
    invoke:
      command: surf.navigation.FailNavigation
    mapping:
      navigation_id: event.request_id
      reason: event.reason
    delivery: at_most_once
    # Dropped on purpose, for the reasons `commit-on-response` gives.
    on_failure: drop

  - id: parse-on-navigation-committed
    summary: A committed navigation's response is parsed into a document at the response's address.
    # Only HTML is parsed. A response of any other media type invokes nothing. `event.url` is the
    # address the navigation committed at: the response's, after the last redirect.
    # UNMAPPED: what a tab shows for a response that is not HTML (an image, plain text, a
    # download) and for a failed navigation (an error page).
    when:
      event: surf.navigation.NavigationCommitted
      where: [event.media_type == "text/html"]
    invoke:
      command: surf.document.ParseDocument
    # `tab_id` is the tab the document is shown in, which a submission of its forms navigates.
    mapping:
      url: event.url
      body: event.body
      navigation_id: event.navigation_id
      tab_id: event.tab_id
    delivery: at_most_once
    # ParseDocument refuses nothing. If it does not run at all, the tab shows no document.
    on_failure: drop

  - id: start-on-traversal-started
    summary: A traversal navigates the tab to the entry's address with Get.
    when:
      event: surf.navigation.TraversalStarted
    invoke:
      command: surf.navigation.StartTraversal
    mapping:
      tab_id: event.tab_id
      url: event.url
      entry_id: event.entry_id
      entry_next: event.entry_next
    delivery: at_most_once
    # StartTraversal refuses nothing. If it does not run at all, the tab keeps its current entry
    # and no navigation starts.
    on_failure: drop

  - id: navigate-on-form-submitted
    summary: A submitted form navigates its document's tab to the request the submission built.
    when:
      event: surf.document.FormSubmitted
    invoke:
      command: surf.navigation.Navigate
    # A `Post` carries the body in `application/x-www-form-urlencoded`; a `Get` carries its entries
    # in the address and no body (HTML Standard, "form submission algorithm", from memory). The
    # initiator is the origin of the form's document.
    mapping:
      tab_id: event.tab_id
      url: event.url
      method: event.method
      body: event.body
      body_type: event.body_type
      initiator: event.initiator
    delivery: at_most_once
    # Navigate refuses nothing. If it does not run at all, the submission is Submitted and the tab
    # keeps its page.
    on_failure: drop

  # The agent's session, as eleven reactions: its actions mapped onto the commands the other
  # components accept, and the navigator's events reported back to it. Each is one attempt inside
  # one process, like the page load's.
  - id: navigate-on-navigation-requested
    summary: An agent's request for an address navigates the session's tab.
    when:
      event: surf.agent.NavigationRequested
    invoke:
      command: surf.navigation.Navigate
    # An agent's `go` and `follow` load an address: `Get`, without a body; a `follow` with the
    # origin of the document whose link it follows as the initiator, a `go` with none.
    mapping:
      tab_id: event.tab_id
      url: event.url
      method: Get
      initiator: event.initiator
    delivery: at_most_once
    # Navigate refuses nothing. If it does not run at all, the session keeps the navigation it
    # had, and the agent sees that nothing started.
    on_failure: drop

  - id: traverse-on-traversal-requested
    summary: An agent's back or forward traverses the session's tab by one step.
    when:
      event: surf.agent.TraversalRequested
    invoke:
      command: surf.navigation.TraverseHistory
    mapping:
      tab_id: event.tab_id
      step: event.step
    delivery: at_most_once
    # Dropped on purpose: a step with no entry, or to an entry made by POST, starts nothing, and
    # the session shows the navigation it had (`agent-back-forward` answers the agent).
    on_failure: drop

  # Every navigation event is delivered, whoever started the navigation; one in a tab no session
  # holds changes nothing.
  - id: note-on-navigation-started
    summary: A started navigation is shown by the session holding its tab.
    when:
      event: surf.navigation.NavigationStarted
    invoke:
      command: surf.agent.NoteNavigationStarted
    mapping:
      tab_id: event.tab_id
      navigation_id: event.navigation_id
      url: event.url
    delivery: at_most_once
    # NoteNavigationStarted refuses nothing. If it does not run, the session shows the navigation
    # before this one.
    on_failure: drop

  - id: note-on-navigation-committed
    summary: A committed navigation is shown as Committed, with its address, status and media type.
    when:
      event: surf.navigation.NavigationCommitted
    invoke:
      command: surf.agent.NoteNavigationCommitted
    mapping:
      navigation_id: event.navigation_id
      url: event.url
      status: event.status
      media_type: event.media_type
    delivery: at_most_once
    # NoteNavigationCommitted refuses nothing. If it does not run, the session shows the
    # navigation as Started.
    on_failure: drop

  - id: note-on-navigation-failed
    summary: A failed navigation is shown as Failed, with its reason.
    when:
      event: surf.navigation.NavigationFailed
    invoke:
      command: surf.agent.NoteNavigationFailed
    mapping:
      navigation_id: event.navigation_id
      reason: event.reason
    delivery: at_most_once
    # As `note-on-navigation-committed`.
    on_failure: drop

  - id: note-on-navigation-cancelled
    summary: A cancelled navigation is shown as Cancelled.
    when:
      event: surf.navigation.NavigationCancelled
    invoke:
      command: surf.agent.NoteNavigationEnded
    mapping:
      navigation_id: event.navigation_id
      state: Cancelled
    delivery: at_most_once
    # As `note-on-navigation-committed`.
    on_failure: drop

  # The agent's `fill`, `pick` and `press`, mapped onto the `document` component's commands. Each
  # of those refuses an element that does not exist, one of another kind, a disabled and a hidden
  # control; the refusal is dropped here, and the session process, which reads the element's row
  # before and after, answers the agent with it.
  - id: set-value-on-fill-requested
    summary: An agent's fill gives the document's control the value.
    when:
      event: surf.agent.FillRequested
    invoke:
      command: surf.document.SetValue
    mapping:
      element_id: event.element_id
      value: event.value
    delivery: at_most_once
    # If SetValue refuses or does not run, the control keeps its value.
    on_failure: drop

  - id: check-on-pick-requested
    summary: An agent's pick without an option activates the document's checkbox or radio button.
    when:
      event: surf.agent.PickRequested
      where: [missing(event.option_id)]
    invoke:
      command: surf.document.Check
    mapping:
      element_id: event.element_id
    delivery: at_most_once
    # If Check refuses or does not run, the control keeps its checkedness.
    on_failure: drop

  - id: select-on-pick-requested
    summary: An agent's pick with an option selects that option of the document's select.
    when:
      event: surf.agent.PickRequested
      where: [defined(event.option_id)]
    invoke:
      command: surf.document.SelectOption
    mapping:
      option_id: event.option_id
    delivery: at_most_once
    # If SelectOption refuses or does not run, the select keeps its options' selectedness.
    on_failure: drop

  - id: submit-on-press-requested
    summary: An agent's press activates the document's button, which starts a submission.
    when:
      event: surf.agent.PressRequested
    invoke:
      command: surf.document.StartSubmission
    mapping:
      element_id: event.element_id
    delivery: at_most_once
    # If StartSubmission refuses or does not run, nothing is submitted.
    on_failure: drop

  - id: close-tab-on-session-closed
    summary: A closed session closes the tab it held.
    when:
      event: surf.agent.SessionClosed
    invoke:
      command: surf.shell.CloseTab
    mapping:
      tab_id: event.tab_id
    delivery: at_most_once
    # Dropped on purpose: a tab the user already closed stays closed, and the session is Closed
    # either way. The window stays Open (the marker at the session's `window` relation).
    on_failure: drop

# UNMAPPED: nothing invokes `surf.render.PaintFrame` yet. A binding from
# `surf.document.DocumentParsed` needs a viewport size, which no event carries: the size belongs
# to the tab or its window, and neither declares one. The renderer also needs the document's
# nodes, and a component reads no other component's rows, so how the tree reaches it is open.
#
# UNMAPPED: no component for storage (cookies, cache, history) or input events. None is
# declared until its first command is. Script execution is part of the document component's
# parser step (`docs/design/scripts.md`, Q7).
