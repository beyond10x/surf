# Every reason word of `docs/design/scripts.md`, Q7's closed list of ends, once under each end
# Q7 gives it: the eight `limit:` words and the seventeen `not run:` words, 25 records of one
# document in the order they were written. Each is `added` and is read back from
# `surf.document.Scripts` with its end and its reason, so a system that stores two reasons as
# one value, or a reason under the other end, fails here. Written by the adversary of
# `story:scripts-spec`: `document-records-script-ends` writes two of the 23 reasons.
type: ess-scenario/6
domain: surf.document
scenario: adversary-script-ends-every-reason
summary: A document being parsed records each of the 25 limit and not-run ends of Q7 once, and reads each back with its reason.

arrange:
