# An agent follows a link: `Follow` with the resolved address starts a navigation of the session's
# tab at that address, and the request it makes has `Get` and no media type. Synthesis shows the
# outcome and its event, not the navigation and the request the binding
# `navigate-on-navigation-requested` and `fetch-on-navigation-started` start after it.
type: ess-scenario/6
domain: surf.agent
scenario: agent-follow-navigates
summary: An agent follows a link, and its tab navigates to the link's target with Get.

arrange:
  - instance: session
    entity: surf.agent.Session
    setup:
      identity: 5a7c1e00-0000-4000-8000-000000000041
      fields:
        window_id: 5a7c1e00-0000-4000-8000-000000000042
        tab_id: 5a7c1e00-0000-4000-8000-000000000043
        holder: 5a7c1e00-0000-4000-8000-000000000041
        scripts: false
      state: Open

timeline:
  - at: 2026-01-06T09:00:00Z
    command: surf.agent.Follow
    actor: surf.agent.SessionHolder
    caller: {session_id: {$instance: session}}
    input:
      session_id: {$instance: session}
      url: http://example.org/offers
      handle: l1
      label: Offers
    outcome: requested
    events:
      - event: surf.agent.NavigationRequested
        payload:
          session_id: {$instance: session}
          tab_id: 5a7c1e00-0000-4000-8000-000000000043
          url: http://example.org/offers
          handle: l1
          label: Offers

assert:
  - view: surf.agent.SessionState
    params: {session_id: {$instance: session}}
    contains:
      session_id: {$instance: session}
      state: Open
      url: http://example.org/offers
      navigation_state: Started

  - view: surf.navigation.Navigations
    contains: {tab_id: 5a7c1e00-0000-4000-8000-000000000043, url: http://example.org/offers, state: Started}

  - view: surf.net.Requests
    contains: {url: http://example.org/offers, method: Get, body_type: null, state: Pending}
