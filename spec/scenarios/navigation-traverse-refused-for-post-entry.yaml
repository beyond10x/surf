# A step back to an entry a POST made is refused and starts no navigation: nothing holds that
# page, and sending the request again could repeat what it did. Synthesis cannot arrange it, for
# the reason `navigation-traverse-refused-at-start.yaml` gives.
type: ess-scenario/6
domain: surf.navigation
scenario: navigation-traverse-refused-for-post-entry
summary: A step back to an entry made by POST is refused and starts nothing.

arrange:
  - instance: posted
    entity: surf.navigation.Navigation
  - instance: b
    entity: surf.navigation.Navigation

timeline:
  # The body is `q=1`.
  - at: 2026-01-06T09:00:00Z
    command: surf.navigation.Navigate
    actor: surf.navigation.User
    input:
      tab_id: 7e5a1b00-0000-4000-8000-000000000401
      url: http://example.org/search
      method: Post
      body: cT0x
      body_type: application/x-www-form-urlencoded
    outcome: started
    capture: {instance: posted, event: surf.navigation.NavigationStarted, field: navigation_id}

  - at: 2026-01-06T09:00:01Z
    command: surf.net.DeliverResponse
    input:
      request_id: {$instance: posted}
      url: http://example.org/search
      status: 200
      media_type: text/plain
      body: aGk=
    outcome: responded

  - at: 2026-01-06T09:00:02Z
    command: surf.navigation.Navigate
    actor: surf.navigation.User
    input:
      tab_id: 7e5a1b00-0000-4000-8000-000000000401
      url: http://example.org/b
      method: Get
    outcome: started
    capture: {instance: b, event: surf.navigation.NavigationStarted, field: navigation_id}

  - at: 2026-01-06T09:00:03Z
    command: surf.net.DeliverResponse
    input:
      request_id: {$instance: b}
      url: http://example.org/b
      status: 200
      media_type: text/plain
      body: aGk=
    outcome: responded

  - at: 2026-01-06T09:00:04Z
    command: surf.navigation.TraverseHistory
    input:
      tab_id: 7e5a1b00-0000-4000-8000-000000000401
      step: back
    outcome: no-entry
    error:
      name: surf.navigation.NoHistoryEntry
      fields: {tab_id: 7e5a1b00-0000-4000-8000-000000000401, step: back}

assert:
  - view: surf.navigation.Navigations
    contains: {navigation_id: {$instance: posted}, method: Post, standing: back}
  - view: surf.navigation.Navigations
    contains: {navigation_id: {$instance: b}, standing: current}
  - view: surf.navigation.Navigations
    counts: {at_least: 2, at_most: 2}
