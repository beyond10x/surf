# Adversary case (story:agent-history-spec). Two tabs, each with its own history: a step back in
# the tab with one entry is refused although the other tab has an entry there, a step back in the
# other tab moves only its entries, and a push in the first moves only the first's.
type: ess-scenario/6
domain: surf.navigation
scenario: adversary-history-two-tabs
summary: A tab's step and push read and move its own entries only, beside another tab's.

arrange:
  - instance: x1
    entity: surf.navigation.Navigation
  - instance: x2
    entity: surf.navigation.Navigation
  - instance: y1
    entity: surf.navigation.Navigation
  - instance: y2
    entity: surf.navigation.Navigation
  - instance: y-back
    entity: surf.navigation.Navigation

timeline:
  - at: 2026-01-06T09:00:00Z
    command: surf.navigation.Navigate
    actor: surf.navigation.User
    input: {tab_id: 7e5a1b00-0000-4000-8000-000000000d01, url: http://example.org/x1, method: Get}
    outcome: started
    capture: {instance: x1, event: surf.navigation.NavigationStarted, field: navigation_id}
  - at: 2026-01-06T09:00:01Z
    command: surf.net.DeliverResponse
    input: {request_id: {$instance: x1}, url: http://example.org/x1, status: 200, media_type: text/plain, body: aGk=}
    outcome: responded
  - at: 2026-01-06T09:00:02Z
    command: surf.navigation.Navigate
    actor: surf.navigation.User
    input: {tab_id: 7e5a1b00-0000-4000-8000-000000000d02, url: http://example.org/y1, method: Get}
    outcome: started
    capture: {instance: y1, event: surf.navigation.NavigationStarted, field: navigation_id}
  - at: 2026-01-06T09:00:03Z
    command: surf.net.DeliverResponse
    input: {request_id: {$instance: y1}, url: http://example.org/y1, status: 200, media_type: text/plain, body: aGk=}
    outcome: responded
  - at: 2026-01-06T09:00:04Z
    command: surf.navigation.Navigate
    actor: surf.navigation.User
    input: {tab_id: 7e5a1b00-0000-4000-8000-000000000d02, url: http://example.org/y2, method: Get}
    outcome: started
    capture: {instance: y2, event: surf.navigation.NavigationStarted, field: navigation_id}
  - at: 2026-01-06T09:00:05Z
    command: surf.net.DeliverResponse
    input: {request_id: {$instance: y2}, url: http://example.org/y2, status: 200, media_type: text/plain, body: aGk=}
    outcome: responded

  - at: 2026-01-06T09:00:06Z
    command: surf.navigation.TraverseHistory
    input: {tab_id: 7e5a1b00-0000-4000-8000-000000000d01, step: back}
    outcome: no-entry
    error:
      name: surf.navigation.NoHistoryEntry
      fields: {tab_id: 7e5a1b00-0000-4000-8000-000000000d01, step: back}

  - at: 2026-01-06T09:00:07Z
    command: surf.navigation.TraverseHistory
    input: {tab_id: 7e5a1b00-0000-4000-8000-000000000d02, step: back}
    outcome: requested
    events:
      - event: surf.navigation.TraversalStarted
        payload: {tab_id: 7e5a1b00-0000-4000-8000-000000000d02, url: http://example.org/y1, entry_id: {$instance: y1}, entry_next: {$instance: y2}}
  - at: 2026-01-06T09:00:08Z
    command: surf.navigation.StartTraversal
    input: {tab_id: 7e5a1b00-0000-4000-8000-000000000d02, url: http://example.org/y1, entry_id: {$instance: y1}, entry_next: {$instance: y2}}
    outcome: started
    capture: {instance: y-back, event: surf.navigation.NavigationStarted, field: navigation_id}
  - at: 2026-01-06T09:00:09Z
    command: surf.net.DeliverResponse
    input: {request_id: {$instance: y-back}, url: http://example.org/y1, status: 200, media_type: text/plain, body: aGk=}
    outcome: responded

  - at: 2026-01-06T09:00:10Z
    command: surf.navigation.Navigate
    actor: surf.navigation.User
    input: {tab_id: 7e5a1b00-0000-4000-8000-000000000d01, url: http://example.org/x2, method: Get}
    outcome: started
    capture: {instance: x2, event: surf.navigation.NavigationStarted, field: navigation_id}
  - at: 2026-01-06T09:00:11Z
    command: surf.net.DeliverResponse
    input: {request_id: {$instance: x2}, url: http://example.org/x2, status: 200, media_type: text/plain, body: aGk=}
    outcome: responded

assert:
  - view: surf.navigation.Navigations
    contains: {navigation_id: {$instance: x1}, standing: back, next: {$instance: x2}}
  - view: surf.navigation.Navigations
    contains: {navigation_id: {$instance: x2}, standing: current}
  - view: surf.navigation.Navigations
    contains: {navigation_id: {$instance: y1}, standing: current, next: {$instance: y2}}
  - view: surf.navigation.Navigations
    contains: {navigation_id: {$instance: y2}, standing: forward}
