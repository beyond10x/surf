# A document's records are its own (`docs/design/scripts.md`, Q7, `owner:`): two documents are
# parsed, each records the ends of its scripts, and `surf.document.Scripts` of each answers its
# own rows and their count, none of the other's.
type: ess-scenario/6
domain: surf.document
scenario: document-scripts-of-two-documents
summary: Two documents record script ends; the Scripts view of each answers its own rows only.

arrange:
  - instance: first
    entity: surf.document.Document
  - instance: second
    entity: surf.document.Document

timeline:
  - at: 2026-01-06T09:00:00Z
    command: surf.document.ParseDocument
    input:
      url: https://example.org/first
      body: PHNjcmlwdD4=
      navigation_id: 5c41e7d0-0000-4000-8000-000000000e01
      tab_id: 5c41e7d0-0000-4000-8000-000000000e02
    outcome: started
    capture: {instance: first, event: surf.document.ParsingStarted, field: document_id}

  - at: 2026-01-06T09:00:01Z
    command: surf.document.ParseDocument
    input:
      url: https://example.org/second
      body: PHNjcmlwdD4=
      navigation_id: 5c41e7d0-0000-4000-8000-000000000e11
      tab_id: 5c41e7d0-0000-4000-8000-000000000e12
    outcome: started
    capture: {instance: second, event: surf.document.ParsingStarted, field: document_id}

  - at: 2026-01-06T09:00:02Z
    command: surf.document.AddScriptEnd
    input:
      document_id: {$instance: first}
      position: 1
      end: Ran
    outcome: added

  - at: 2026-01-06T09:00:03Z
    command: surf.document.AddScriptEnd
    input:
      document_id: {$instance: second}
      position: 1
      end: Faulted
    outcome: added

  - at: 2026-01-06T09:00:04Z
    command: surf.document.AddScriptEnd
    input:
      document_id: {$instance: second}
      position: 2
      end: NotRun
      reason: Faulted
    outcome: added

assert:
  - view: surf.document.Scripts
    params: {document_id: {$instance: first}}
    counts: {at_least: 1, at_most: 1}
  - view: surf.document.Scripts
    params: {document_id: {$instance: first}}
    contains: {document_id: {$instance: first}, position: 1, end: Ran, reason: null}
  - view: surf.document.Scripts
    params: {document_id: {$instance: second}}
    counts: {at_least: 2, at_most: 2}
  - view: surf.document.Scripts
    params: {document_id: {$instance: second}}
    contains: {document_id: {$instance: second}, position: 1, end: Faulted, reason: null}
  - view: surf.document.Scripts
    params: {document_id: {$instance: second}}
    contains: {document_id: {$instance: second}, position: 2, end: NotRun, reason: Faulted}
