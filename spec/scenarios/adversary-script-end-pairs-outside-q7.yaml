# What `surf.document.AddScriptEnd` accepts that `docs/design/scripts.md` does not have. Q7's
# closed list pairs `Ran` and `Faulted` with nothing, `Limit` with the eight limit words,
# `NotRun` with the seventeen not-run words, `Threw` with a kind, and `Refused` with the
# `SyntaxError` of a refusal (Q16); it records one end per element, each with its position from
# 1; Q16 keeps at most 1,024 characters of a message and a line and column from 1 below 2^32.
# The specification's types and guards hold none of these, so each record below is `added`:
# `Ran` with a reason, `NotRun` with a limit's word, `Limit` with `eof`, `Threw` without a
# kind, `Refused` with `TypeError`, `NotRun` without a reason, a second record at position
# 6, positions 0 and -1, `Faulted` with a reason and a kind, a message of 1,025 characters at
# line 0 column 0, line and column 2^32, and `Ran` with an error. Written by the adversary of
# `story:scripts-spec`: it pins the acceptance; a guard that refuses one of them changes its
# outcome here.
type: ess-scenario/6
domain: surf.document
scenario: adversary-script-end-pairs-outside-q7
summary: AddScriptEnd adds records whose end and reason, position or error fields Q7 and Q16 do not allow.

arrange:
  - instance: page
    entity: surf.document.Document

