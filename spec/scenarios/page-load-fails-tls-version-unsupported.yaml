# A page load over `https:` whose server offers at best TLS 1.2. Synthesis sends only the first
# variant of a reason, so this is the scenario that sends TlsVersionUnsupported and reads it back
# from the navigation and the session.
type: ess-scenario/6
domain: surf.navigation
scenario: page-load-fails-tls-version-unsupported
summary: A navigation whose request ends with TlsVersionUnsupported is Failed and the session shows the reason.

arrange:
  - instance: session
    entity: surf.agent.Session
    setup:
      identity: 7c3e5a00-0000-4000-8000-000000000041
      fields:
        window_id: 7c3e5a00-0000-4000-8000-000000000042
        tab_id: 7c3e5a00-0000-4000-8000-000000000043
        holder: 7c3e5a00-0000-4000-8000-000000000041
      state: Open
  - instance: load
    entity: surf.navigation.Navigation

timeline:
  - at: 2026-01-08T12:00:00Z
    command: surf.navigation.Navigate
    actor: surf.navigation.User
    input:
      tab_id: 7c3e5a00-0000-4000-8000-000000000043
      url: https://tls12.example.org/
      method: Get
    outcome: started
    events:
      - event: surf.navigation.NavigationStarted
        payload:
          tab_id: 7c3e5a00-0000-4000-8000-000000000043
          url: https://tls12.example.org/
    capture: {instance: load, event: surf.navigation.NavigationStarted, field: navigation_id}

  - at: 2026-01-08T12:00:01Z
    command: surf.net.FailRequest
    input:
      request_id: {$instance: load}
      reason: TlsVersionUnsupported
    outcome: failed
    events:
      - event: surf.net.FetchFailed
        payload:
          request_id: {$instance: load}
          url: https://tls12.example.org/
          reason: TlsVersionUnsupported

assert:
  - view: surf.net.Requests
    contains: {request_id: {$instance: load}, url: https://tls12.example.org/, state: Failed}

  - view: surf.navigation.Navigations
    contains: {navigation_id: {$instance: load}, state: Failed}

  - view: surf.agent.SessionState
    params: {session_id: {$instance: session}}
    contains:
      session_id: {$instance: session}
      state: Open
      url: https://tls12.example.org/
      navigation_state: Failed
      status: null
      media_type: null
      failure_reason: TlsVersionUnsupported
