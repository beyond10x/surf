# A script's end is written only while its document is `Parsing` (`docs/design/scripts.md`,
# Q7, `written:`): after `FinishParsing` it is refused, as `AddForm` refuses a form then:
# `already-parsed`, with the state `Parsed`, and the document keeps its title.
type: ess-scenario/6
domain: surf.document
scenario: document-refuses-script-end-after-parsing
summary: A script end of a document already Parsed is refused with DocumentStateConflict; the document is unchanged.

arrange:
  - instance: page
    entity: surf.document.Document

timeline:
  - at: 2026-01-06T09:00:00Z
    command: surf.document.ParseDocument
    input:
      url: https://example.org/done
      body: PHNjcmlwdD4=
      navigation_id: 5c41e7d0-0000-4000-8000-000000000301
      tab_id: 5c41e7d0-0000-4000-8000-000000000302
    outcome: started
    capture: {instance: page, event: surf.document.ParsingStarted, field: document_id}

  - at: 2026-01-06T09:00:01Z
    command: surf.document.FinishParsing
    input:
      document_id: {$instance: page}
      title: Done
      encoding: UTF-8
    outcome: parsed

  - at: 2026-01-06T09:00:02Z
    command: surf.document.AddScriptEnd
    input:
      document_id: {$instance: page}
      position: 1
      end: NotRun
      reason: Eof
    outcome: already-parsed
    error:
      name: surf.document.DocumentStateConflict
      fields: {state: Parsed}

assert:
  - view: surf.document.Documents
    contains: {document_id: {$instance: page}, state: Parsed, title: Done}
