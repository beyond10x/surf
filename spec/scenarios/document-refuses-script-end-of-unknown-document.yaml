# The end of a script of a document no row holds is refused, as `AddForm` refuses a form of
# one (`docs/design/scripts.md`, Q7): `no-such-document`, naming the identity, and nothing is
# added. The document that exists is untouched and still `Parsing`.
type: ess-scenario/6
domain: surf.document
scenario: document-refuses-script-end-of-unknown-document
summary: A script end of an unknown document is refused with DocumentNotFound; the existing document stays Parsing.

arrange:
  - instance: page
    entity: surf.document.Document

timeline:
  - at: 2026-01-06T09:00:00Z
    command: surf.document.ParseDocument
    input:
      url: https://example.org/known
      body: PHNjcmlwdD4=
      navigation_id: 5c41e7d0-0000-4000-8000-000000000201
      tab_id: 5c41e7d0-0000-4000-8000-000000000202
    outcome: started
    capture: {instance: page, event: surf.document.ParsingStarted, field: document_id}

  - at: 2026-01-06T09:00:01Z
    command: surf.document.AddScriptEnd
    input:
      document_id: 5c41e7d0-0000-4000-8000-0000000002ff
      position: 1
      end: Ran
    outcome: no-such-document
    error:
      name: surf.document.DocumentNotFound
      fields: {document_id: 5c41e7d0-0000-4000-8000-0000000002ff}

assert:
  - view: surf.document.Documents
    counts: {at_least: 1, at_most: 1}
  - view: surf.document.Documents
    contains: {document_id: {$instance: page}, state: Parsing}
