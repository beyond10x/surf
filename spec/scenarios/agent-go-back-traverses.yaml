# An agent goes back: after the session's tab loaded A and then B, `GoBack` publishes
# `TraversalRequested`, `traverse-on-traversal-requested` asks the navigator for the entry before
# the current one, and `start-on-traversal-started` starts a navigation to A with `Get`, whose
# request `fetch-on-navigation-started` makes. The session shows that navigation as Started at A.
# Synthesis shows the outcome and its event, not the traversal the bindings start after it.
type: ess-scenario/6
domain: surf.agent
scenario: agent-go-back-traverses
summary: An agent goes back, and its tab starts a navigation to the entry before the current one, with Get.

arrange:
  - instance: session
    entity: surf.agent.Session
    setup:
      identity: 7e5a1b00-0000-4000-8000-000000000701
      fields:
        window_id: 7e5a1b00-0000-4000-8000-000000000702
        tab_id: 7e5a1b00-0000-4000-8000-000000000703
        holder: 7e5a1b00-0000-4000-8000-000000000701
        scripts: false
      state: Open
  - instance: a
    entity: surf.navigation.Navigation
  - instance: b
    entity: surf.navigation.Navigation

timeline:
  - at: 2026-01-06T09:00:00Z
    command: surf.navigation.Navigate
    actor: surf.navigation.User
    input:
      tab_id: 7e5a1b00-0000-4000-8000-000000000703
      url: http://example.org/a
      method: Get
    outcome: started
    capture: {instance: a, event: surf.navigation.NavigationStarted, field: navigation_id}

  - at: 2026-01-06T09:00:01Z
    command: surf.net.DeliverResponse
    input:
      request_id: {$instance: a}
      url: http://example.org/a
      method: Get
      status: 200
      media_type: text/plain
      body: aGk=
    outcome: responded

  - at: 2026-01-06T09:00:02Z
    command: surf.navigation.Navigate
    actor: surf.navigation.User
    input:
      tab_id: 7e5a1b00-0000-4000-8000-000000000703
      url: http://example.org/b
      method: Get
    outcome: started
    capture: {instance: b, event: surf.navigation.NavigationStarted, field: navigation_id}

  - at: 2026-01-06T09:00:03Z
    command: surf.net.DeliverResponse
    input:
      request_id: {$instance: b}
      url: http://example.org/b
      method: Get
      status: 200
      media_type: text/plain
      body: aGk=
    outcome: responded

  - at: 2026-01-06T09:00:04Z
    command: surf.agent.GoBack
    actor: surf.agent.SessionHolder
    caller: {session_id: {$instance: session}}
    input:
      session_id: {$instance: session}
    outcome: requested
    events:
      - event: surf.agent.TraversalRequested
        payload:
          session_id: {$instance: session}
          tab_id: 7e5a1b00-0000-4000-8000-000000000703
          step: back

assert:
  - view: surf.navigation.Navigations
    contains: {tab_id: 7e5a1b00-0000-4000-8000-000000000703, url: http://example.org/a, handling: traverse, entry_id: {$instance: a}, entry_next: {$instance: b}, state: Started}
  - view: surf.navigation.Navigations
    contains: {navigation_id: {$instance: b}, standing: current}
  - view: surf.net.Requests
    contains: {url: http://example.org/a, method: Get, body_type: null, state: Pending}
  - view: surf.agent.SessionState
    params: {session_id: {$instance: session}}
    contains:
      session_id: {$instance: session}
      state: Open
      url: http://example.org/a
      navigation_state: Started
