# The ends of a document's scripts (`docs/design/scripts.md`, Q7): while the document is
# `Parsing`, the parser step records one end per script element, in the order the ends happened,
# and then finishes parsing. One record of each of the six ends of `surf.document.ScriptEnd`:
# a script that ran, one that threw a `TypeError` with its message, line and column, one swell
# refused, one a limit ended, one that faulted, and one the end of the input closed (`NotRun`,
# `Eof`). Each is `added`, and its event carries the position and the end, no page text. The
# view `surf.document.Scripts` reads back the six records ranked by position, each with its
# position, end and reason.
type: ess-scenario/6
domain: surf.document
scenario: document-records-script-ends
summary: A document being parsed records six script ends, one of each kind, in order, and is then Parsed.

arrange:
  - instance: page
    entity: surf.document.Document

timeline:
  - at: 2026-01-06T09:00:00Z
    command: surf.document.ParseDocument
    input:
      url: https://example.org/scripts
      body: PHNjcmlwdD4=
      navigation_id: 5c41e7d0-0000-4000-8000-000000000101
      tab_id: 5c41e7d0-0000-4000-8000-000000000102
    outcome: started
    capture: {instance: page, event: surf.document.ParsingStarted, field: document_id}

  - at: 2026-01-06T09:00:01Z
    command: surf.document.AddScriptEnd
    input:
      document_id: {$instance: page}
      position: 1
      end: Ran
    outcome: added
    events:
      - event: surf.document.ScriptEndAdded
        payload:
          document_id: {$instance: page}
          position: 1
          end: Ran

  - at: 2026-01-06T09:00:02Z
    command: surf.document.AddScriptEnd
    input:
      document_id: {$instance: page}
      position: 2
      end: Threw
      error_kind: TypeError
      message: "x is not a function"
      line: 3
      column: 5
      dynamic: false
    outcome: added
    events:
      - event: surf.document.ScriptEndAdded
        payload:
          document_id: {$instance: page}
          position: 2
          end: Threw

  - at: 2026-01-06T09:00:03Z
    command: surf.document.AddScriptEnd
    input:
      document_id: {$instance: page}
      position: 3
      end: Refused
      error_kind: SyntaxError
      message: "class declarations are slice 7"
      line: 1
      column: 1
      dynamic: false
    outcome: added
    events:
      - event: surf.document.ScriptEndAdded
        payload:
          document_id: {$instance: page}
          position: 3
          end: Refused

  - at: 2026-01-06T09:00:04Z
    command: surf.document.AddScriptEnd
    input:
      document_id: {$instance: page}
      position: 4
      end: Limit
      reason: StepsPerScript
    outcome: added
    events:
      - event: surf.document.ScriptEndAdded
        payload:
          document_id: {$instance: page}
          position: 4
          end: Limit

  - at: 2026-01-06T09:00:05Z
    command: surf.document.AddScriptEnd
    input:
      document_id: {$instance: page}
      position: 5
      end: Faulted
    outcome: added
    events:
      - event: surf.document.ScriptEndAdded
        payload:
          document_id: {$instance: page}
          position: 5
          end: Faulted

  - at: 2026-01-06T09:00:06Z
    command: surf.document.AddScriptEnd
    input:
      document_id: {$instance: page}
      position: 6
      end: NotRun
      reason: Eof
    outcome: added
    events:
      - event: surf.document.ScriptEndAdded
        payload:
          document_id: {$instance: page}
          position: 6
          end: NotRun

  - at: 2026-01-06T09:00:07Z
    command: surf.document.FinishParsing
    input:
      document_id: {$instance: page}
      title: ""
      encoding: UTF-8
    outcome: parsed

assert:
  - view: surf.document.Documents
    contains: {document_id: {$instance: page}, state: Parsed, stopped_by: null}
  - view: surf.document.Scripts
    params: {document_id: {$instance: page}}
    counts: {at_least: 6, at_most: 6}
  - view: surf.document.Scripts
    params: {document_id: {$instance: page}}
    ranked: true
  - view: surf.document.Scripts
    params: {document_id: {$instance: page}}
    at:
      row: first
      fields: {document_id: {$instance: page}, position: 1, end: Ran, reason: null}
  - view: surf.document.Scripts
    params: {document_id: {$instance: page}}
    at:
      row: last
      fields: {document_id: {$instance: page}, position: 6, end: NotRun, reason: Eof}
  - view: surf.document.Scripts
    params: {document_id: {$instance: page}}
    contains: {document_id: {$instance: page}, position: 1, end: Ran, reason: null, error_kind: null, message: null, line: null, column: null, dynamic: null}
  - view: surf.document.Scripts
    params: {document_id: {$instance: page}}
    contains: {document_id: {$instance: page}, position: 2, end: Threw, reason: null, error_kind: TypeError, message: "x is not a function", line: 3, column: 5, dynamic: false}
  - view: surf.document.Scripts
    params: {document_id: {$instance: page}}
    contains: {document_id: {$instance: page}, position: 3, end: Refused, reason: null, error_kind: SyntaxError, message: "class declarations are slice 7", line: 1, column: 1, dynamic: false}
  - view: surf.document.Scripts
    params: {document_id: {$instance: page}}
    contains: {document_id: {$instance: page}, position: 4, end: Limit, reason: StepsPerScript, error_kind: null, message: null, line: null, column: null, dynamic: null}
  - view: surf.document.Scripts
    params: {document_id: {$instance: page}}
    contains: {document_id: {$instance: page}, position: 5, end: Faulted, reason: null, error_kind: null, message: null, line: null, column: null, dynamic: null}
  - view: surf.document.Scripts
    params: {document_id: {$instance: page}}
    contains: {document_id: {$instance: page}, position: 6, end: NotRun, reason: Eof, error_kind: null, message: null, line: null, column: null, dynamic: null}
