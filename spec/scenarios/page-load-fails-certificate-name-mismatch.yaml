# A page load over `https:` whose server's certificate names another host. Synthesis sends only
# the first variant of a reason, so this is the scenario that sends CertificateNameMismatch and
# reads it back from the navigation and the session.
type: ess-scenario/6
domain: surf.navigation
scenario: page-load-fails-certificate-name-mismatch
summary: A navigation whose request ends with CertificateNameMismatch is Failed and the session shows the reason.

arrange:
  - instance: session
    entity: surf.agent.Session
    setup:
      identity: 7c3e5a00-0000-4000-8000-000000000031
      fields:
        window_id: 7c3e5a00-0000-4000-8000-000000000032
        tab_id: 7c3e5a00-0000-4000-8000-000000000033
        holder: 7c3e5a00-0000-4000-8000-000000000031
      state: Open
  - instance: load
    entity: surf.navigation.Navigation

timeline:
  - at: 2026-01-08T11:00:00Z
    command: surf.navigation.Navigate
    actor: surf.navigation.User
    input:
      tab_id: 7c3e5a00-0000-4000-8000-000000000033
      url: https://wrong-host.example.org/
      method: Get
    outcome: started
    events:
      - event: surf.navigation.NavigationStarted
        payload:
          tab_id: 7c3e5a00-0000-4000-8000-000000000033
          url: https://wrong-host.example.org/
    capture: {instance: load, event: surf.navigation.NavigationStarted, field: navigation_id}

  - at: 2026-01-08T11:00:01Z
    command: surf.net.FailRequest
    input:
      request_id: {$instance: load}
      reason: CertificateNameMismatch
    outcome: failed
    events:
      - event: surf.net.FetchFailed
        payload:
          request_id: {$instance: load}
          url: https://wrong-host.example.org/
          reason: CertificateNameMismatch

assert:
  - view: surf.net.Requests
    contains: {request_id: {$instance: load}, url: https://wrong-host.example.org/, state: Failed}

  - view: surf.navigation.Navigations
    contains: {navigation_id: {$instance: load}, state: Failed}

  - view: surf.agent.SessionState
    params: {session_id: {$instance: session}}
    contains:
      session_id: {$instance: session}
      state: Open
      url: https://wrong-host.example.org/
      navigation_state: Failed
      status: null
      media_type: null
      failure_reason: CertificateNameMismatch
