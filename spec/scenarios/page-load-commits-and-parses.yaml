# The page load end to end, which synthesis cannot arrange: it needs a navigation and a request
# that share one identity, and only the `fetch-on-navigation-started` binding makes that pair.
# Covers the flow of `commit-on-response` and `parse-on-navigation-committed`.
type: ess-scenario/6
domain: surf.navigation
scenario: page-load-commits-and-parses
summary: A navigation whose request gets an HTML response is Committed and has a document being parsed for it.

arrange:
  - instance: load
    entity: surf.navigation.Navigation

timeline:
  - at: 2026-01-06T09:00:00Z
    command: surf.navigation.Navigate
    actor: surf.navigation.User
    input:
      tab_id: 3f1d5b7e-0000-4000-8000-000000000001
      url: https://example.org/
      method: Get
    outcome: started
    events:
      - event: surf.navigation.NavigationStarted
        payload:
          url: https://example.org/
    capture: {instance: load, event: surf.navigation.NavigationStarted, field: navigation_id}

  # The body is `<html></html>`.
  - at: 2026-01-06T09:00:01Z
    command: surf.net.DeliverResponse
    input:
      request_id: {$instance: load}
      url: https://example.org/
      method: Get
      status: 200
      media_type: text/html
      body: PGh0bWw+PC9odG1sPg==
    outcome: responded

assert:
  # The request `fetch-on-navigation-started` made is for the address navigated to.
  - view: surf.net.Requests
    contains: {request_id: {$instance: load}, url: https://example.org/, state: Responded}

  - view: surf.navigation.Navigations
    contains: {navigation_id: {$instance: load}, state: Committed}

  - view: surf.document.Documents
    contains: {url: https://example.org/, navigation_id: {$instance: load}, state: Parsing, title: null}
