version: '3'

set: [pipefail]

tasks:
  view-test:
    desc: The live view's page tests in a browser (view-tests/, Playwright, Chromium's headless shell).
    summary: |
      The live view's page tests in a browser (story:view-first-page; item 4 of
      docs/design/live-view.md).

      Builds surf-agent, surf-session and surf-view-fixture with the flags of task build, so it
      rebuilds nothing check built; installs view-tests/ from its package-lock.json with npm ci
      (offline when the npm cache holds the pin); runs npx playwright test --workers=2 in
      view-tests/. Each test starts its own target/debug/surf-view-fixture: a page server, surfd
      in process and sessions, under a directory of its own in $XDG_RUNTIME_DIR.

      It installs no browser: Chromium's headless shell of the revision @playwright/test names
      must be in the Playwright cache (npx --prefix view-tests playwright install --only-shell
      chromium). No slot inside: run alone as slot task --taskfile taskfiles/view-test.yml
      view-test; under slot task check its commands are already in a job of the pool.
    dir: '{{.TASKFILE_DIR}}/..'
    env:
      RUSTFLAGS: -D warnings
    cmds:
      - cargo build --locked --quiet -p surf-agent -p surf-session -p surf-view-fixture
      - npm --prefix view-tests ci --prefer-offline --no-audit --no-fund
      - cd view-tests && npx playwright test --workers=2
