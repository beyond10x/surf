version: '3'

set: [pipefail]

tasks:
  page-step-cpu:
    desc: The page step's CPU seconds (user plus kernel) and instructions (user only) of the Playwright call and every process under it (perf stat).
    summary: |
      The page step's CPU seconds (user plus kernel) and instructions (user only) of the Playwright call and every process under it (perf stat).

      story:page-step-holds-under-load. Builds surf-agent, surf-session and surf-view-fixture and
      runs task view-test-setup as task view-test does, then taskfiles/page-step-cpu.sh: the
      Playwright call of task view-test, unchanged, under perf stat -e task-clock,instructions,
      as one slot job (slot --timeout 15m). It prints the load before and after, the ten
      slowest tests, the line of task view-test, "page step cpu: T s" and "page step
      instructions: I G (user only)", and writes T to .out/page-step.cpu and I to
      .out/page-step.instructions. The bound is in instructions (AGENTS.md): the CPU seconds and
      the wall time follow the host's load. Needs perf and a kernel.perf_event_paranoid of 2 or
      less. Not a step of task check. Run it without slot: the build and the call take their own
      slots.
    dir: '{{.TASKFILE_DIR}}/..'
    silent: true
    env:
      RUSTFLAGS: -D warnings
    cmds:
      - cargo build --locked --quiet -p surf-agent -p surf-session -p surf-view-fixture
      - task: view-test-setup
      - sh taskfiles/page-step-cpu.sh
