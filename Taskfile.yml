version: '3'

set: [pipefail]

includes:
  cli:
    taskfile: taskfiles/cli.yml
    flatten: true
    optional: true
  site:
    taskfile: taskfiles/site.yml
    flatten: true
    optional: true
  html-conformance:
    taskfile: taskfiles/html-conformance.yml
    flatten: true
    optional: true
  tls-x509-conformance:
    taskfile: taskfiles/tls-x509-conformance.yml
    flatten: true
    optional: true
  release:
    taskfile: taskfiles/release.yml
    flatten: true
    optional: true
  view-stream-check:
    taskfile: taskfiles/view-stream-check.yml
    flatten: true
    optional: true
  view-test:
    taskfile: taskfiles/view-test.yml
    flatten: true
    optional: true
  page-step-cpu:
    taskfile: taskfiles/page-step-cpu.yml
    flatten: true
    optional: true
  check-runner:
    taskfile: taskfiles/check-runner.yml
    flatten: true
    optional: true
  forge-watch:
    taskfile: taskfiles/forge-watch.yml
    flatten: true
    optional: true
  planning-only:
    taskfile: taskfiles/planning-only.yml
    flatten: true
    optional: true
  test-layout:
    taskfile: taskfiles/test-layout.yml
    flatten: true
    optional: true
  tls-anchors:
    taskfile: taskfiles/tls-anchors.yml
    flatten: true
    optional: true
  tls-certs:
    taskfile: taskfiles/tls-certs.yml
    flatten: true
    optional: true
  tls-flights:
    taskfile: taskfiles/tls-flights.yml
    flatten: true
    optional: true
  agent-tasks:
    taskfile: taskfiles/agent-tasks.yml
    flatten: true
    optional: true
  sh-echo:
    taskfile: taskfiles/sh-echo.yml
    flatten: true
    optional: true
  doc-tests:
    taskfile: taskfiles/doc-tests.yml
    flatten: true
    optional: true

vars:
  REFUSALS_MAX: 56
  TLS_PACKAGES: [surf-tls, surf-tls-test-server, surf-tls-test-certs, surf-tls-conformance]
  GENERATED_PACKAGES: [agent, document, navigator, net, renderer, shell, surf-system, surf-types]
  SYNTHESIZE: ess generate synthesize --strict-requires --path spec --target rust

tasks:
  validate:
    desc: Validate the specification; a warning fails it.
    cmds:
      - mkdir -p .out
      - ess --strict-requires specify validate --path spec > .out/validate.log 2>&1 || { cat .out/validate.log; exit 1; }
      - if grep '^warning' .out/validate.log; then exit 1; fi
      - tail -n 1 .out/validate.log

  suite:
    desc: Synthesize the conformance suite, with the authored scenarios, into .out/suite.json.
    cmds:
      - mkdir -p .out
      - ess verify conform synthesize --path spec --scenarios spec --out .out/suite.json > .out/synthesize.log 2>&1 || { cat .out/synthesize.log; exit 1; }
      - tail -n 1 .out/synthesize.log
      - test "$(grep -c '^refused:' .out/synthesize.log)" -le {{.REFUSALS_MAX}}

  conform:
    desc: Run the suite against the interpreter built into ess.
    deps: [suite]
    cmds:
      - ess verify conform run --path spec --suite .out/suite.json --target interpreted --report-format 2 --report-out .out/report.json > .out/conform.log 2>&1 || { grep -E '^  (failed|error)' .out/conform.log; tail -n 1 .out/conform.log; exit 1; }
      - tail -n 1 .out/conform.log

  conform-rust:
    desc: Run the suite against the Rust system in process, and the planted-defect tests beside it, within 120 s.
    summary: |
      Run the suite against the Rust system in process, and the planted-defect tests beside it, within 120 s.

      Both live in the crate conformance/ (surf-conformance), a Cargo workspace of its own with
      its own Cargo.lock and target/: it is the one place third-party crates are allowed, the
      ess-conformance runner from github.com/beyond10x/ess at tag 0.97.4 and what it brings. The
      root workspace, and so task build and task test, do not reach it. cargo fetches the tag
      when its cache does not hold it.

      First the fast check: sh taskfiles/conform-noticed.sh check compares the digest of the
      sources of conformance/tests/noticed.txt with its first line, and fails with
      "conform-rust: the sources of conformance/tests/noticed.txt changed; run task
      conform-slow". Then, warnings denied, it builds the crate's tests (cargo nextest run
      --no-run) and its binary (cargo build), into .out/conform-rust-build.log. The setup step,
      surf-conformance --narrow, admits the whole suite once and writes the narrowed suite of
      every planted defect of the list under conformance/target/noticed/<digest>/, unless they
      are there for exactly this list; admitting the whole suite takes seconds under load, so
      no test process does it but the two controls. It is untimed like the builds: a product
      made once from the sources, not a run of the tests.

      The timed part. Step 1 runs the crate's tests with cargo-nextest under the root's
      .config/nextest.toml, into .out/conform-rust-test.log: one process per test, a test still
      running after 60 s is ended and fails, and a failure does not stop the run. It fails
      unless the planted-defect test ran and passed: the suite over a system whose Navigation
      storage drops every put must report at least one failed scenario. It fails too unless the
      two per-entity tests of tests/two_of_each_entity.rs ran and passed: for each entity alone,
      a system that gives every instance one identity, and one whose view answers its first row
      only, must each fail at least one scenario. It fails when nextest's summary reports a
      skipped test: the crate has no ignored test. Each planted defect runs over the scenarios
      its line of conformance/tests/noticed.txt names, at most 3, from its narrowed suite; the
      two controls run the whole suite.

      Step 2 runs .out/suite.json against the system the surf binary ships, the built
      conformance/target/debug/surf-conformance, each scenario over fresh in-memory ports and a
      transport that never answers, because the suite ends each request itself with
      DeliverResponse or FailRequest. The log is .out/conform-rust.log and the
      ess-conformance-report/2 is .out/conform-rust.json. It fails when any scenario failed,
      errored or was unsupported. It runs under timeout(1) of coreutils, ended after
      CONFORM_SUITE_BOUND seconds (60), and then fails with a line naming the step and the
      bound.

      Then it prints nextest's summary line, the runner's summary line of step 2, the ten
      slowest tests from .out/conform-rust-junit.xml (its copy of nextest's report
      conformance/target/nextest/default/junit.xml, which task conform-slow writes too) and the
      wall time of the two steps, the builds left out: "conformance step: N s of its budget
      of 120 s", or "conformance step: N s, over its budget of 120 s" and it fails. The budget
      is CONFORM_BUDGET seconds (120). It writes N to .out/conform-step.seconds, which it
      removes first.
    deps: [suite]
    env:
      RUSTFLAGS: -D warnings
    vars:
      CONFORM_BUDGET: '{{.CONFORM_BUDGET | default "120"}}'
      CONFORM_SUITE_BOUND: '{{.CONFORM_SUITE_BOUND | default "60"}}'
    silent: true
    cmds:
      - rm -f .out/conform-step.seconds
      - mkdir -p .out
      - sh taskfiles/conform-noticed.sh check
      - cargo nextest run --no-run --locked --manifest-path conformance/Cargo.toml --config-file .config/nextest.toml --color never > .out/conform-rust-build.log 2>&1 || { cat .out/conform-rust-build.log; exit 1; }
      - cargo build --locked --manifest-path conformance/Cargo.toml --color never >> .out/conform-rust-build.log 2>&1 || { cat .out/conform-rust-build.log; exit 1; }
      - conformance/target/debug/surf-conformance --narrow .out/suite.json conformance/tests/noticed.txt
      - |
        log=.out/conform-rust-test.log
        junit=.out/conform-rust-junit.xml
        rm -f conformance/target/nextest/default/junit.xml "$junit"
        start=$(date +%s%N)
        tests=0
        cargo nextest run --locked --manifest-path conformance/Cargo.toml --config-file .config/nextest.toml --color never > "$log" 2>&1 || tests=1
        if [ -f conformance/target/nextest/default/junit.xml ]; then cp conformance/target/nextest/default/junit.xml "$junit"; fi
        passed() { grep -q "^ *PASS \[.*\] .*surf-conformance::main $1\$" "$log"; }
        planted=0
        passed planted_defect::a_navigation_storage_that_drops_every_put_fails_at_least_one_scenario || planted=1
        entities=0
        passed two_of_each_entity::one_identity_for_every_instance_of_an_entity_is_noticed_for_each_entity && passed two_of_each_entity::a_view_cut_to_its_first_row_is_noticed_for_each_entity || entities=1
        summary=$(grep -E '^ *Summary \[' "$log" | tail -n 1 | sed 's/^ *//')
        skipped=$(printf '%s\n' "$summary" | sed -n 's/.* \([0-9][0-9]*\) skipped.*/\1/p')
        suite=0
        timeout {{.CONFORM_SUITE_BOUND}} conformance/target/debug/surf-conformance .out/suite.json .out/conform-rust.json > .out/conform-rust.log 2>&1 || suite=$?
        elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
        if [ "$tests" -ne 0 ] || [ "$planted" -ne 0 ] || [ "$entities" -ne 0 ] || [ "${skipped:-0}" -ne 0 ]; then cat "$log"; fi
        if [ "$planted" -ne 0 ]; then echo "the planted-defect test did not run"; fi
        if [ "$entities" -ne 0 ]; then echo "the per-entity planted-defect tests did not run"; fi
        if [ "${skipped:-0}" -ne 0 ]; then echo "conform-rust: nextest skipped ${skipped} test(s); the crate has no ignored test, so each one runs"; fi
        if [ "$suite" -eq 124 ]; then
          echo "conform-rust: step 2, the suite against the Rust system, was ended after its bound of {{.CONFORM_SUITE_BOUND}} s"
        elif [ "$suite" -ne 0 ]; then
          grep -E '^  (failed|error|unsupported) ' .out/conform-rust.log || cat .out/conform-rust.log
        fi
        printf '%s\n' "$summary"
        tail -n 1 .out/conform-rust.log
        if [ -f "$junit" ]; then
          echo "the ten slowest tests:"
          sh taskfiles/slowest-tests.sh "$junit" 10
        fi
        seconds=$(( elapsed / 1000 )).$(( elapsed % 1000 / 100 ))
        echo "$seconds" > .out/conform-step.seconds
        if [ "$elapsed" -gt $(( {{.CONFORM_BUDGET}} * 1000 )) ]; then
          echo "conformance step: ${seconds} s, over its budget of {{.CONFORM_BUDGET}} s"
          exit 1
        fi
        echo "conformance step: ${seconds} s of its budget of {{.CONFORM_BUDGET}} s"
        test "$tests" -eq 0 && test "$planted" -eq 0 && test "$entities" -eq 0 && test "${skipped:-0}" -eq 0 && test "$suite" -eq 0

  conform-slow:
    desc: Run every planted defect of conformance/ over the whole suite, write .out/noticed.txt and compare it with conformance/tests/noticed.txt; WRITE=1 writes it; never a step of check.
    summary: |
      Run every planted defect of conformance/ over the whole suite, write .out/noticed.txt and compare it with conformance/tests/noticed.txt; WRITE=1 writes it; never a step of check.

      A step of the lane slow. It runs the planted-defect tests of the crate (planted_defect's
      defect test, review2_planted_defects:: and two_of_each_entity::, controls included) with
      cargo-nextest, warnings denied, with SURF_NOTICED_OUT set to .out/noticed.d: each
      planted-defect test then runs its defects over the whole suite, the defects of one test
      each on a thread of its own, still asserts that each is noticed, and writes one line per
      defect, its label and the first 3 scenarios, in the suite's order, that do not pass over
      it, and its count line over the whole suite. It prints nextest's summary and the 29 count
      lines (sh taskfiles/conform-noticed.sh counts). sh taskfiles/conform-noticed.sh assemble
      puts the digest of the sources first and the lines after it, sorted, into
      .out/noticed.txt; its log is .out/conform-slow.log. It fails when a test failed or when
      .out/noticed.txt differs from the committed file byte for byte, showing the difference.
      With WRITE=1 it copies .out/noticed.txt over conformance/tests/noticed.txt first. A change
      to a source of the list (.out/suite.json through spec/, any file under conformance/src or
      conformance/tests, conformance/Cargo.toml, conformance/Cargo.lock) runs it with WRITE=1
      and commits the list in the same commit.
    deps: [suite]
    env:
      RUSTFLAGS: -D warnings
    vars:
      WRITE: '{{.WRITE | default ""}}'
    silent: true
    cmds:
      - |
        set -eu
        out=.out/noticed.d
        rm -rf "$out"
        mkdir -p "$out"
        SURF_NOTICED_OUT="$PWD/$out" cargo nextest run --locked --manifest-path conformance/Cargo.toml --config-file .config/nextest.toml --color never -E 'test(=planted_defect::a_navigation_storage_that_drops_every_put_fails_at_least_one_scenario) | test(/^review2_planted_defects::/) | test(/^two_of_each_entity::/)' > .out/conform-slow.log 2>&1 || { cat .out/conform-slow.log; exit 1; }
        grep -E '^ *Summary \[' .out/conform-slow.log | tail -n 1 | sed 's/^ *//'
        sh taskfiles/conform-noticed.sh counts "$out"
        sh taskfiles/conform-noticed.sh assemble "$out" > .out/noticed.txt
        if [ '{{.WRITE}}' = 1 ]; then
          cp .out/noticed.txt conformance/tests/noticed.txt
        fi
        if ! cmp -s .out/noticed.txt conformance/tests/noticed.txt; then
          diff conformance/tests/noticed.txt .out/noticed.txt || true
          echo "conform-slow: .out/noticed.txt differs from conformance/tests/noticed.txt; run task conform-slow WRITE=1 and commit it"
          exit 1
        fi
        echo "conform-slow: $(( $(wc -l < .out/noticed.txt) - 1 )) planted defects, .out/noticed.txt equals conformance/tests/noticed.txt"

  conform-totals:
    desc: Fail when the Rust run and the interpreter's run are of different suites or totals.
    summary: |
      Fail when the Rust run and the interpreter's run are of different suites or totals.

      Reads the two ess-conformance-report/2 files: .out/report.json, which task conform writes,
      and .out/conform-rust.json, which task conform-rust writes. Each names the suite it ran by
      its digest, the sha256 of the suite's bytes, and counts its scenarios in counts.total. It
      prints both and fails when either report is missing or holds no digest or total, when the
      digests differ, or when the totals differ. Synthesis writes the same bytes for the same
      spec/, so the two runs of one task check carry one digest.

      Each run fails on its own when a scenario did not pass; this catches a runner or a suite
      change that drops scenarios on one side only. task check runs it after both.

      The script is taskfiles/conform-totals.sh; the tests of crates/surf/tests/conform_totals.rs
      run it with sh, without task.
    silent: true
    cmds:
      - sh taskfiles/conform-totals.sh

  lock-check:
    desc: Fail, naming each package, when the root Cargo.lock holds one from outside this repository that is not on taskfiles/lock-allow.txt, or a crate of this repository depends on a listed package or on surf-script without a line of taskfiles/lock-owners.txt.
    summary: |
      Fail, naming each package, when the root Cargo.lock holds one from outside this repository
      that is not on taskfiles/lock-allow.txt, or a crate of this repository depends on a listed
      package or on surf-script without a line of taskfiles/lock-owners.txt.

      Nothing that ships uses a third-party crate but ring, the one source of cryptographic
      primitives, and the script engine swell, one crate of the organization taken by a git
      dependency on a release tag (AGENTS.md, Goals). The root Cargo.lock proves it with three
      rules:
      - every package with a source line (one cargo took from a registry or a git repository)
        matches a line of taskfiles/lock-allow.txt on name, version, source and checksum, the
        checksum none for a package from git (the 19 packages of ring, the six of swell);
      - a crate of this repository depends on a package of that list, or on surf-script (the
        one crate that runs swell), only by a line "<package> <crate>" of
        taskfiles/lock-owners.txt: ring by surf-tls, swell by surf-script, surf-script by none;
      - each package from git has overflow-checks = true in its table
        [profile.release.package.<name>] of the root Cargo.toml, since cargo reads no profile
        from a dependency's manifest; the root Cargo.toml holds no multi-line string, and the
        tree's .cargo/config.toml (and .cargo/config), which override the root manifest's
        profiles, name no package from git in a profile and turn overflow-checks off in none.
        Outside what a check of the tree can see: the config file of a directory above the
        tree or of CARGO_HOME, a --config on a command line and CARGO_PROFILE_* variables.
      A package without a source line that bears a listed name fails, and so does a line of
      the list that no package matches, a line of the owners file no dependency uses, a line
      of either file written twice, and a missing Cargo.lock, list, owners file or manifest.
      The lock is read only in the form cargo writes: a line in
      any other form fails with its number, also where cargo would accept it as another
      spelling of the same TOML. taskfiles/lock-check.sh does the work and names each finding;
      its head states the format of the list and of the owners file.

      conformance/ has a lock of its own, which this does not read: it is the one place a
      third-party crate is allowed beside ring. A path dependency on a directory outside this
      repository has no source line, and is not caught here.
    silent: true
    cmds:
      - sh taskfiles/lock-check.sh Cargo.lock taskfiles/lock-allow.txt taskfiles/lock-owners.txt Cargo.toml

  generate:
    desc: Rewrite generated/rust from spec/ with ess, in place.
    summary: |
      Rewrite generated/rust from spec/ with ess, in place.

      ess keeps the record of what it wrote in generated/rust/.ess-output/state.json, which is
      committed. With it, ess regenerates a checkout or an older generation in place: it replaces
      the files it recorded, removes the ones it no longer writes, and leaves a tree it would not
      change byte for byte untouched, state.json included. Without generated/rust it writes a
      fresh tree.

      ess refuses, naming the file, when a file it recorded was edited by hand. Delete that file,
      or restore it from git, and run this again.
    cmds:
      - mkdir -p .out
      - '{{.SYNTHESIZE}} --out generated/rust > .out/generate.log 2>&1 || { cat .out/generate.log; exit 1; }'
      - tail -n 1 .out/generate.log

  generated-check:
    desc: Fail, naming each path, when generated/rust is not what task generate writes.
    summary: |
      Fail, naming each path, when generated/rust is not what task generate writes.

      Step 1 generates spec/ into .out/generated-check/fresh and compares every file ess writes
      there, byte for byte, with generated/rust. The number of files compared must equal the
      artifact count ess prints. A path ess writes that generated/rust lacks or holds with other
      bytes fails, and so does any other file in generated/rust. Three paths are left out of step
      1:
      - .ess-output/, which holds only state.json, is ess's record and not an artifact. ess
        mints a new anchor_id for every fresh output root (ess 0.96.0, measured 2026-11-20), so
        a fresh generation never matches the committed record.
      - target/ and Cargo.lock directly under generated/rust are written by cargo when it is run
        inside generated/rust, not by ess. git ignores both.

      Step 1 also compares the executable bits of every file in both trees, .ess-output/state.json
      included: a file executable in one and not in the other fails as "generated/rust/<path>:
      executable, and ess writes it not executable", or the reverse. Only the executable bits are
      compared, because git records no other mode and the rest follows the umask.

      Every entry under generated/rust that is neither a regular file nor a directory, such as a
      symbolic link to a file or to a directory, fails step 1 as "generated/rust/<path>: not a
      regular file", wherever it is: inside .ess-output, and named target or Cargo.lock, too.
      Only the contents of a target directory are not looked at. generated/rust itself fails
      when it is a symbolic link.

      Step 2 covers state.json. It copies generated/rust without the two cargo paths into
      .out/generated-check/compare/in-place and regenerates there, as task generate would. ess
      refuses when state.json cannot be read or does not record the bytes beside it, and the task
      then names state.json. Afterwards .ess-output must be byte for byte the committed one.

      The generation of step 1 is task generated-fresh; the comparison and step 2 are task
      generated-compare. This task runs both, in that order.
    cmds:
      - task: generated-fresh
      - task: generated-compare

  generated-fresh:
    desc: Generate spec/ into .out/generated-check/fresh, once per run of task.
    summary: |
      Generate spec/ into .out/generated-check/fresh, once per run of task.

      Writes the tree, ess's output into fresh.log beside it, a copy of the spec/ it read into
      fresh.spec, and the three listings of the tree, fresh.list, fresh.all and
      fresh.executable (sh taskfiles/generated-compare.sh --lists). It runs once per run of
      task: task check runs it for generated-check, and task test, which depends on it, then
      finds it done. The tests of generated-check in crates/surf/tests read this one generation,
      check that fresh.spec is the spec/ of the checkout and that the listings are there, and
      run taskfiles/generated-compare.sh <this tree> (the script of task generated-compare) in
      their copies, so no test generates or lists the tree again. The script refuses the
      listings when the tree or its log is newer than one of them.
    run: once
    silent: true
    vars:
      DIR: .out/generated-check
    cmds:
      - rm -rf {{.DIR}}
      - mkdir -p {{.DIR}}
      - '{{.SYNTHESIZE}} --out {{.DIR}}/fresh > {{.DIR}}/fresh.log 2>&1 || { cat {{.DIR}}/fresh.log; exit 1; }'
      - cp -R spec {{.DIR}}/fresh.spec
      - sh taskfiles/generated-compare.sh --lists {{.DIR}}/fresh

  generated-compare:
    desc: Compare generated/rust with the tree task generated-fresh wrote (FRESH, a directory).
    summary: |
      Compare generated/rust with the tree task generated-fresh wrote (FRESH, a directory).

      Steps 1 and 2 of task generated-check without the generation: FRESH (default
      .out/generated-check/fresh) is the fresh tree and FRESH.log the output ess printed for it.
      Its own files go to .out/generated-check/compare, which it removes first. Step 2 still runs
      ess, over a copy of the committed generated/rust. It reads the listings FRESH.list,
      FRESH.all and FRESH.executable that task generated-fresh writes, and refuses them, naming
      the listing, when FRESH or FRESH.log is newer; without them it lists FRESH into its own
      directory, never beside FRESH.

      The script is taskfiles/generated-compare.sh; the tests of
      crates/surf/tests/*generated_check*.rs run it with sh in their copies, without task.
    silent: true
    vars:
      FRESH: '{{.FRESH | default ".out/generated-check/fresh"}}'
    cmds:
      - sh taskfiles/generated-compare.sh '{{.FRESH}}'

  build:
    desc: Build the root workspace, hand-written and generated crates, with warnings denied.
    env:
      RUSTFLAGS: -D warnings
    cmds:
      - mkdir -p .out
      - cargo build --workspace --all-targets --locked > .out/build.log 2>&1 || { cat .out/build.log; exit 1; }
      - tail -n 1 .out/build.log

  test:
    desc: Test the root workspace but the four TLS packages with cargo-nextest and the doc tests of surf-ports with cargo test, warnings denied, within 120 s.
    summary: |
      Test the root workspace but the four TLS packages with cargo-nextest and the doc tests of surf-ports with cargo test, warnings denied, within 120 s.

      cargo nextest run --workspace --exclude <each of TLS_PACKAGES> --exclude <each of
      GENERATED_PACKAGES> runs every test but the doc tests and the tests of surf-tls,
      surf-tls-test-server, surf-tls-test-certs and surf-tls-conformance, which task test-tls
      runs in a step and budget of its own. The eight packages ess writes under
      generated/rust/crates hold no test, and their manifests are ess's, so the step leaves them
      out instead of a test = false in each; every other target without a test has test = false
      in its manifest, and task test-layout fails on a #[test] in such a target. One process
      per test, as .config/nextest.toml sets it: a test still running after 60 s is ended and
      fails, and a failure does not stop the run. Its log is .out/test.log; nextest writes its
      JUnit report to target/nextest/default/junit.xml, which the task copies to
      .out/test-junit.xml. cargo test --doc -p surf-ports runs the doc tests, which nextest does
      not run, into .out/test-doc.log: surf-ports holds the two doc tests of the workspace, and
      task doc-tests-check fails on a doc test in any other package, so rustdoc is not started
      for the others. The doc tests start in the background before nextest and the step waits
      for both, since most of their time is rustdoc compiling, which needs no test slot of
      nextest (story test-step-scripts-and-binaries: the step minus nextest's Summary was 4.6,
      3.3 and 2.5 s with it against 13.0, 12.3 and 8.5 s without, in three alternating pairs);
      each writes its own log, and the step fails when either fails.

      It prints the ten slowest tests from .out/test-junit.xml, nextest's summary line, and one
      count line for what it ran: "N tests: P passed, F failed, I ignored", where N is what
      nextest ran and skipped plus every doc test, a test nextest ended counts as failed and a
      test nextest skips (#[ignore]) as ignored; after it how many came from each runner.
      Then the wall time of the two commands together, without the time before the task
      started. It fails when a test failed, and when that time is over TEST_BUDGET seconds
      (120), naming the time. It writes the time to .out/test-step.seconds, which it removes
      first, for task step-budgets.

      It depends on task cli (.out/cli/) and on task generated-fresh, the one generation the
      tests of generated-check compare against.
    deps: [cli, generated-fresh]
    env:
      RUSTFLAGS: -D warnings
      SURF_BIN_DIR: '{{.ROOT_DIR}}/target/debug'
    vars:
      TEST_BUDGET: '{{.TEST_BUDGET | default "120"}}'
    silent: true
    cmds:
      - rm -f .out/test-step.seconds
      - task: build
      - mkdir -p .out
      - |
        junit=.out/test-junit.xml
        rm -f target/nextest/default/junit.xml "$junit"
        start=$(date +%s%N)
        cargo test --doc -p surf-ports --locked --color never > .out/test-doc.log 2>&1 &
        doc=$!
        tests=0
        cargo nextest run --workspace{{range .TLS_PACKAGES}} --exclude {{.}}{{end}}{{range .GENERATED_PACKAGES}} --exclude {{.}}{{end}} --locked --color never > .out/test.log 2>&1 || tests=1
        docs=0
        wait "$doc" || docs=1
        elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
        if [ -f target/nextest/default/junit.xml ]; then cp target/nextest/default/junit.xml "$junit"; fi
        if [ "$tests" -ne 0 ]; then cat .out/test.log; fi
        if [ "$docs" -ne 0 ]; then cat .out/test-doc.log; fi
        if [ -f "$junit" ]; then
          echo "the ten slowest tests:"
          sh taskfiles/slowest-tests.sh "$junit" 10
        fi
        summary=$(grep -E '^ *Summary \[' .out/test.log | tail -n 1)
        test -n "$summary" && echo "$summary" | sed 's/^ *//'
        printf '%s\n' "$summary" | sed 's/([^)]*)//g; s/.* run: //' | tr ',' '\n' | awk -v doc="$(awk '/^test result:/ { p += $4; f += $6; i += $8 } END { print p + 0, f + 0, i + 0 }' .out/test-doc.log)" '
          $1 ~ /^[0-9]+$/ { if ($2 == "passed") p += $1; else if ($2 == "skipped") i += $1; else f += $1 }
          END {
            split(doc, d, " ")
            n = p + f + i
            printf "%d tests: %d passed, %d failed, %d ignored (cargo-nextest %d, doc tests %d)\n", n + d[1] + d[2] + d[3], p + d[1], f + d[2], i + d[3], n, d[1] + d[2] + d[3]
          }'
        seconds=$(( elapsed / 1000 )).$(( elapsed % 1000 / 100 ))
        echo "$seconds" > .out/test-step.seconds
        if [ "$elapsed" -gt $(( {{.TEST_BUDGET}} * 1000 )) ]; then
          echo "test step: ${seconds} s, over its budget of {{.TEST_BUDGET}} s"
          exit 1
        fi
        echo "test step: ${seconds} s of its budget of {{.TEST_BUDGET}} s"
        test "$tests" -eq 0 && test "$docs" -eq 0

  test-tls:
    desc: Test the four TLS packages with cargo-nextest, warnings denied, within 120 s of their own.
    summary: |
      Test the four TLS packages with cargo-nextest, warnings denied, within 120 s of their own.

      cargo nextest run -p <each of TLS_PACKAGES> runs the tests of surf-tls,
      surf-tls-test-server, surf-tls-test-certs and surf-tls-conformance, the packages task test
      leaves out, under the same .config/nextest.toml: one process per test, a test still running
      after 60 s is ended and fails, and a failure does not stop the run. These packages hold no
      doc test. No other package depends on them and only they set a feature of surf-tls, so
      this build and the one of task test share every artifact. Its log is .out/test-tls.log;
      nextest writes its JUnit report to target/nextest/default/junit.xml, which the task copies
      to .out/test-tls-junit.xml, beside the copy of task test.

      It prints the ten slowest tests from .out/test-tls-junit.xml, nextest's summary line, and
      the count line "N tests: P passed, F failed, I ignored (cargo-nextest N)", a test nextest
      ended counted as failed and a test it skips (#[ignore]) as ignored. Then the wall time of
      the nextest run, without the time before the task started. It fails when a test failed,
      and when that time is over TLS_TEST_BUDGET seconds (120), naming the time. The budget is
      its own: the time of task test does not count against it, nor its time against task test.
      It writes the time to .out/tls-test-step.seconds, which it removes first, for task
      step-budgets.
    env:
      RUSTFLAGS: -D warnings
      SURF_BIN_DIR: '{{.ROOT_DIR}}/target/debug'
    vars:
      TLS_TEST_BUDGET: '{{.TLS_TEST_BUDGET | default "120"}}'
    silent: true
    cmds:
      - rm -f .out/tls-test-step.seconds
      - task: build
      - mkdir -p .out
      - |
        junit=.out/test-tls-junit.xml
        rm -f target/nextest/default/junit.xml "$junit"
        start=$(date +%s%N)
        tests=0
        cargo nextest run{{range .TLS_PACKAGES}} -p {{.}}{{end}} --locked --color never > .out/test-tls.log 2>&1 || tests=1
        elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
        if [ -f target/nextest/default/junit.xml ]; then cp target/nextest/default/junit.xml "$junit"; fi
        if [ "$tests" -ne 0 ]; then cat .out/test-tls.log; fi
        if [ -f "$junit" ]; then
          echo "the ten slowest tests:"
          sh taskfiles/slowest-tests.sh "$junit" 10
        fi
        summary=$(grep -E '^ *Summary \[' .out/test-tls.log | tail -n 1)
        test -n "$summary" && echo "$summary" | sed 's/^ *//'
        printf '%s\n' "$summary" | sed 's/([^)]*)//g; s/.* run: //' | tr ',' '\n' | awk '
          $1 ~ /^[0-9]+$/ { if ($2 == "passed") p += $1; else if ($2 == "skipped") i += $1; else f += $1 }
          END {
            n = p + f + i
            printf "%d tests: %d passed, %d failed, %d ignored (cargo-nextest %d)\n", n, p, f, i, n
          }'
        seconds=$(( elapsed / 1000 )).$(( elapsed % 1000 / 100 ))
        echo "$seconds" > .out/tls-test-step.seconds
        if [ "$elapsed" -gt $(( {{.TLS_TEST_BUDGET}} * 1000 )) ]; then
          echo "tls test step: ${seconds} s, over its budget of {{.TLS_TEST_BUDGET}} s"
          exit 1
        fi
        echo "tls test step: ${seconds} s of its budget of {{.TLS_TEST_BUDGET}} s"
        test "$tests" -eq 0

  open:
    desc: List every open question the specification marks.
    cmds:
      - grep -rn 'UNMAPPED:' spec cli

  check:
    desc: Run the complete repository gate.
    cmds:
      - task: validate
      - task: conform
      - task: conform-rust
      - task: conform-totals
      - task: generated-check
      - task: cli
      - task: lock-check
      - task: test-layout
      - task: tls-certs-check
      - task: tls-flights-check
      - task: doc-tests-check
      - task: build
      - task: test
      - task: test-tls
      - task: agent-tasks-report
      - task: sh-echo
      - task: view-stream-check
      - task: view-test
      - task: html-conformance
      - task: tls-x509-conformance
      - task: forge-watch-test
      - task: planning-only-test
      - task: test-layout-test
      - task: sh-echo-test
      - task: doc-tests-check-test
      - task: step-budgets

  step-budgets:
    desc: Print the sum of the four timed steps of check, read from the seconds files the steps wrote under .out/.
    summary: |
      Print the sum of the four timed steps of check, read from the seconds files the steps
      wrote under .out/.

      sh taskfiles/step-budgets.sh .out reads .out/test-step.seconds (task test),
      .out/tls-test-step.seconds (task test-tls), .out/conform-step.seconds (task conform-rust)
      and .out/page-step.seconds (task view-test), the wall time of each step, which fails over
      its own budget of 120 s, and prints "four steps: N s (test step A s, tls test step B s, conformance step C s, page
      step D s)", N their sum. It fails naming the file when one is missing or holds no number.
      It has no budget of its own. The last step of check.
    silent: true
    cmds:
      - sh taskfiles/step-budgets.sh .out

  slow:
    desc: Make the committed products of the TLS tests and the conformance crate's list of noticed scenarios again and compare them with the committed files (the test certificates byte for byte, the recorded flights by outcome, conformance/tests/noticed.txt byte for byte); needs openssl 3.4 or later; never a step of check.
    cmds:
      - task: tls-certs-slow
      - task: tls-flights-slow
      - task: conform-slow
