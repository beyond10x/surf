version: '3'

set: [pipefail]

includes:
  cli:
    taskfile: taskfiles/cli.yml
    flatten: true
    optional: true
  site:
    taskfile: taskfiles/site.yml
    flatten: true
    optional: true
  html-conformance:
    taskfile: taskfiles/html-conformance.yml
    flatten: true
    optional: true
  tls-x509-conformance:
    taskfile: taskfiles/tls-x509-conformance.yml
    flatten: true
    optional: true
  release:
    taskfile: taskfiles/release.yml
    flatten: true
    optional: true
  view-stream-check:
    taskfile: taskfiles/view-stream-check.yml
    flatten: true
    optional: true
  view-test:
    taskfile: taskfiles/view-test.yml
    flatten: true
    optional: true
  check-runner:
    taskfile: taskfiles/check-runner.yml
    flatten: true
    optional: true
  forge-watch:
    taskfile: taskfiles/forge-watch.yml
    flatten: true
    optional: true
  planning-only:
    taskfile: taskfiles/planning-only.yml
    flatten: true
    optional: true
  test-layout:
    taskfile: taskfiles/test-layout.yml
    flatten: true
    optional: true
  tls-anchors:
    taskfile: taskfiles/tls-anchors.yml
    flatten: true
    optional: true
  tls-certs:
    taskfile: taskfiles/tls-certs.yml
    flatten: true
    optional: true
  tls-flights:
    taskfile: taskfiles/tls-flights.yml
    flatten: true
    optional: true
  agent-tasks:
    taskfile: taskfiles/agent-tasks.yml
    flatten: true
    optional: true
  sh-echo:
    taskfile: taskfiles/sh-echo.yml
    flatten: true
    optional: true

vars:
  REFUSALS_MAX: 48
  SYNTHESIZE: ess generate synthesize --strict-requires --path spec --target rust

tasks:
  validate:
    desc: Validate the specification; a warning fails it.
    cmds:
      - mkdir -p .out
      - ess --strict-requires specify validate --path spec > .out/validate.log 2>&1 || { cat .out/validate.log; exit 1; }
      - if grep '^warning' .out/validate.log; then exit 1; fi
      - tail -n 1 .out/validate.log

  suite:
    desc: Synthesize the conformance suite, with the authored scenarios, into .out/suite.json.
    cmds:
      - mkdir -p .out
      - ess verify conform synthesize --path spec --scenarios spec --out .out/suite.json > .out/synthesize.log 2>&1 || { cat .out/synthesize.log; exit 1; }
      - tail -n 1 .out/synthesize.log
      - test "$(grep -c '^refused:' .out/synthesize.log)" -le {{.REFUSALS_MAX}}

  conform:
    desc: Run the suite against the interpreter built into ess.
    deps: [suite]
    cmds:
      - ess verify conform run --path spec --suite .out/suite.json --target interpreted --report-format 2 --report-out .out/report.json > .out/conform.log 2>&1 || { grep -E '^  (failed|error)' .out/conform.log; tail -n 1 .out/conform.log; exit 1; }
      - tail -n 1 .out/conform.log

  conform-rust:
    desc: Run the suite against the Rust system in process, and the planted-defect test beside it.
    summary: |
      Run the suite against the Rust system in process, and the planted-defect test beside it.

      Both live in the crate conformance/ (surf-conformance), a Cargo workspace of its own with
      its own Cargo.lock and target/: it is the one place third-party crates are allowed, the
      ess-conformance runner from github.com/beyond10x/ess at tag 0.97.3 and what it brings. The
      root workspace, and so task build and task test, do not reach it. cargo fetches the tag
      when its cache does not hold it.

      Step 1 runs the crate's tests with warnings denied, into .out/conform-rust-test.log. It
      fails unless the planted-defect test ran and passed: the suite over a system whose
      Navigation storage drops every put must report at least one failed scenario. It fails too
      unless the two per-entity tests of tests/two_of_each_entity.rs ran and passed: for each
      entity alone, a system that gives every instance one identity, and one whose view answers
      its first row only, must each fail at least one scenario.

      Step 2 runs .out/suite.json against the system the surf binary ships, each scenario over
      fresh in-memory ports and a transport that never answers, because the suite ends each
      request itself with DeliverResponse or FailRequest. The log is .out/conform-rust.log and
      the ess-conformance-report/2 is .out/conform-rust.json. It fails when any scenario failed,
      errored or was unsupported, and prints the runner's summary line.
    deps: [suite]
    env:
      RUSTFLAGS: -D warnings
    cmds:
      - mkdir -p .out
      - cargo test --locked --manifest-path conformance/Cargo.toml -- --nocapture > .out/conform-rust-test.log 2>&1 || { cat .out/conform-rust-test.log; exit 1; }
      - grep -q '^test planted_defect::a_navigation_storage_that_drops_every_put_fails_at_least_one_scenario \.\.\. ok$' .out/conform-rust-test.log || { cat .out/conform-rust-test.log; echo "the planted-defect test did not run"; exit 1; }
      - grep -q '^test two_of_each_entity::one_identity_for_every_instance_of_an_entity_is_noticed_for_each_entity \.\.\. ok$' .out/conform-rust-test.log && grep -q '^test two_of_each_entity::a_view_cut_to_its_first_row_is_noticed_for_each_entity \.\.\. ok$' .out/conform-rust-test.log || { cat .out/conform-rust-test.log; echo "the per-entity planted-defect tests did not run"; exit 1; }
      - cargo run --locked --manifest-path conformance/Cargo.toml -- .out/suite.json .out/conform-rust.json > .out/conform-rust.log 2>&1 || { grep -E '^  (failed|error|unsupported) ' .out/conform-rust.log || cat .out/conform-rust.log; tail -n 1 .out/conform-rust.log; exit 1; }
      - tail -n 1 .out/conform-rust.log

  conform-totals:
    desc: Fail when the Rust run and the interpreter's run are of different suites or totals.
    summary: |
      Fail when the Rust run and the interpreter's run are of different suites or totals.

      Reads the two ess-conformance-report/2 files: .out/report.json, which task conform writes,
      and .out/conform-rust.json, which task conform-rust writes. Each names the suite it ran by
      its digest, the sha256 of the suite's bytes, and counts its scenarios in counts.total. It
      prints both and fails when either report is missing or holds no digest or total, when the
      digests differ, or when the totals differ. Synthesis writes the same bytes for the same
      spec/, so the two runs of one task check carry one digest.

      Each run fails on its own when a scenario did not pass; this catches a runner or a suite
      change that drops scenarios on one side only. task check runs it after both.
    silent: true
    cmds:
      - |
        for report in .out/report.json .out/conform-rust.json; do
          test -f "$report" || { echo "$report: missing; run task conform and task conform-rust first"; exit 1; }
        done
        interpreter=$(tr -d ' \n' < .out/report.json)
        rust=$(tr -d ' \n' < .out/conform-rust.json)
        interpreter_total=$(printf '%s\n' "$interpreter" | sed -n 's/.*"counts":{[^}]*"total":\([0-9][0-9]*\).*/\1/p')
        rust_total=$(printf '%s\n' "$rust" | sed -n 's/.*"counts":{[^}]*"total":\([0-9][0-9]*\).*/\1/p')
        interpreter_suite=$(printf '%s\n' "$interpreter" | sed -n 's/.*"suite":{"digest":"\([^"]*\)".*/\1/p')
        rust_suite=$(printf '%s\n' "$rust" | sed -n 's/.*"suite":{"digest":"\([^"]*\)".*/\1/p')
        if [ -n "$interpreter_total" ] && [ -n "$interpreter_suite" ] && [ "$interpreter_total" = "$rust_total" ] && [ "$interpreter_suite" = "$rust_suite" ]; then
          echo "the interpreter and the Rust system ran $rust_total scenario(s) each, of suite $rust_suite"
          exit 0
        fi
        echo "interpreter: ${interpreter_total:-no} scenario(s) of suite ${interpreter_suite:-unknown} (.out/report.json)"
        echo "rust: ${rust_total:-no} scenario(s) of suite ${rust_suite:-unknown} (.out/conform-rust.json)"
        echo "the two runs differ; each must run every scenario of the same suite"
        exit 1

  lock-check:
    desc: Fail, naming each package, when the root Cargo.lock holds one from outside this repository that is not on taskfiles/lock-allow.txt, or a crate other than surf-tls depends on one that is.
    summary: |
      Fail, naming each package, when the root Cargo.lock holds one from outside this repository
      that is not on taskfiles/lock-allow.txt, or a crate other than surf-tls depends on one that is.

      Nothing that ships uses a third-party crate but ring, the one source of cryptographic
      primitives (AGENTS.md, Goals), and the root Cargo.lock proves it with two rules:
      - every package with a source line (one cargo took from a registry or a git repository)
        matches a line of taskfiles/lock-allow.txt on name, version, source and checksum;
      - no crate of this repository but surf-tls depends on a package of that list.
      A line of the list that no package matches fails too, and so does a missing Cargo.lock.
      The lock is read only in the form cargo writes: a line in any other form fails with its
      number, also where cargo would accept it as another spelling of the same TOML.
      taskfiles/lock-check.sh does the work and names each finding; its head states the format
      of the list.

      conformance/ has a lock of its own, which this does not read: it is the one place a
      third-party crate is allowed beside ring. A path dependency on a directory outside this
      repository has no source line, and is not caught here.
    silent: true
    cmds:
      - sh taskfiles/lock-check.sh Cargo.lock taskfiles/lock-allow.txt

  generate:
    desc: Rewrite generated/rust from spec/ with ess, in place.
    summary: |
      Rewrite generated/rust from spec/ with ess, in place.

      ess keeps the record of what it wrote in generated/rust/.ess-output/state.json, which is
      committed. With it, ess regenerates a checkout or an older generation in place: it replaces
      the files it recorded, removes the ones it no longer writes, and leaves a tree it would not
      change byte for byte untouched, state.json included. Without generated/rust it writes a
      fresh tree.

      ess refuses, naming the file, when a file it recorded was edited by hand. Delete that file,
      or restore it from git, and run this again.
    cmds:
      - mkdir -p .out
      - '{{.SYNTHESIZE}} --out generated/rust > .out/generate.log 2>&1 || { cat .out/generate.log; exit 1; }'
      - tail -n 1 .out/generate.log

  generated-check:
    desc: Fail, naming each path, when generated/rust is not what task generate writes.
    summary: |
      Fail, naming each path, when generated/rust is not what task generate writes.

      Step 1 generates spec/ into .out/generated-check/fresh and compares every file ess writes
      there, byte for byte, with generated/rust. The number of files compared must equal the
      artifact count ess prints. A path ess writes that generated/rust lacks or holds with other
      bytes fails, and so does any other file in generated/rust. Three paths are left out of step
      1:
      - .ess-output/, which holds only state.json, is ess's record and not an artifact. ess
        mints a new anchor_id for every fresh output root (ess 0.96.0, measured 2026-11-20), so
        a fresh generation never matches the committed record.
      - target/ and Cargo.lock directly under generated/rust are written by cargo when it is run
        inside generated/rust, not by ess. git ignores both.

      Step 1 also compares the executable bits of every file in both trees, .ess-output/state.json
      included: a file executable in one and not in the other fails as "generated/rust/<path>:
      executable, and ess writes it not executable", or the reverse. Only the executable bits are
      compared, because git records no other mode and the rest follows the umask.

      Every entry under generated/rust that is neither a regular file nor a directory, such as a
      symbolic link to a file or to a directory, fails step 1 as "generated/rust/<path>: not a
      regular file", wherever it is: inside .ess-output, and named target or Cargo.lock, too.
      Only the contents of a target directory are not looked at. generated/rust itself fails
      when it is a symbolic link.

      Step 2 covers state.json. It copies generated/rust without the two cargo paths into
      .out/generated-check/compare/in-place and regenerates there, as task generate would. ess
      refuses when state.json cannot be read or does not record the bytes beside it, and the task
      then names state.json. Afterwards .ess-output must be byte for byte the committed one.

      The generation of step 1 is task generated-fresh; the comparison and step 2 are task
      generated-compare. This task runs both, in that order.
    cmds:
      - task: generated-fresh
      - task: generated-compare

  generated-fresh:
    desc: Generate spec/ into .out/generated-check/fresh, once per run of task.
    summary: |
      Generate spec/ into .out/generated-check/fresh, once per run of task.

      Writes the tree, ess's output into fresh.log beside it, and a copy of the spec/ it read
      into fresh.spec. It runs once per run of task: task check runs it for generated-check, and
      task test, which depends on it, then finds it done. The tests of generated-check in
      crates/surf/tests read this one generation, check that fresh.spec is the spec/ of the
      checkout, and run task generated-compare FRESH=<this tree> in their copies, so no test
      generates the tree again.
    run: once
    silent: true
    vars:
      DIR: .out/generated-check
    cmds:
      - rm -rf {{.DIR}}
      - mkdir -p {{.DIR}}
      - '{{.SYNTHESIZE}} --out {{.DIR}}/fresh > {{.DIR}}/fresh.log 2>&1 || { cat {{.DIR}}/fresh.log; exit 1; }'
      - cp -R spec {{.DIR}}/fresh.spec

  generated-compare:
    desc: Compare generated/rust with the tree task generated-fresh wrote (FRESH, a directory).
    summary: |
      Compare generated/rust with the tree task generated-fresh wrote (FRESH, a directory).

      Steps 1 and 2 of task generated-check without the generation: FRESH (default
      .out/generated-check/fresh) is the fresh tree and FRESH.log the output ess printed for it.
      Its own files go to .out/generated-check/compare, which it removes first. Step 2 still runs
      ess, over a copy of the committed generated/rust.
    silent: true
    vars:
      FRESH: '{{.FRESH | default ".out/generated-check/fresh"}}'
      DIR: .out/generated-check/compare
    cmds:
      - rm -rf {{.DIR}}
      - mkdir -p {{.DIR}}
      - |
        test -d "{{.FRESH}}" && test -f "{{.FRESH}}.log" || { echo "{{.FRESH}}: no generation; run task generated-fresh"; exit 1; }
        export LC_ALL=C
        (cd "{{.FRESH}}" && find . -path ./.ess-output -prune -o -type f -print) | sed 's|^\./||' | sort > {{.DIR}}/fresh.list
        reported=$(sed -n 's/^\([0-9][0-9]*\) artifact(s), written to .*/\1/p' "{{.FRESH}}.log")
        found=$(wc -l < {{.DIR}}/fresh.list)
        if [ "$found" -ne "${reported:-0}" ]; then
          echo "ess reports ${reported:-no} artifact(s) and wrote $found file(s) besides .ess-output; the check would not cover what ess reports"
          exit 1
        fi
        : > {{.DIR}}/drift.txt
        if [ -L generated/rust ]; then
          echo "generated/rust: a symbolic link, not a directory" >> {{.DIR}}/drift.txt
        fi
        (cd "{{.FRESH}}" && find . -type f -print) | sed 's|^\./||' | sort > {{.DIR}}/fresh.all
        (cd "{{.FRESH}}" && find . -type f -perm /111 -print) | sed 's|^\./||' | sort > {{.DIR}}/fresh.executable
        if [ -d generated/rust ]; then
          (cd generated/rust && find . \( -path ./.ess-output -o -path ./target -o -path ./Cargo.lock \) -prune -o -type f -print) | sed 's|^\./||' | sort > {{.DIR}}/committed.list
          (cd generated/rust && find . \( -path ./target -type d \) -prune -o ! -type f ! -type d -print) | sed 's|^\./||' | sort | sed 's|^|generated/rust/|; s|$|: not a regular file|' >> {{.DIR}}/drift.txt
          (cd generated/rust && find . \( -path ./target -o -path ./Cargo.lock \) -prune -o -type f -print) | sed 's|^\./||' | sort > {{.DIR}}/committed.all
          (cd generated/rust && find . \( -path ./target -o -path ./Cargo.lock \) -prune -o -type f -perm /111 -print) | sed 's|^\./||' | sort > {{.DIR}}/committed.executable
        else
          : > {{.DIR}}/committed.list
          : > {{.DIR}}/committed.all
          : > {{.DIR}}/committed.executable
        fi
        comm -23 {{.DIR}}/fresh.list {{.DIR}}/committed.list | sed 's|^|generated/rust/|; s|$|: missing|' >> {{.DIR}}/drift.txt
        comm -13 {{.DIR}}/fresh.list {{.DIR}}/committed.list | sed 's|^|generated/rust/|; s|$|: not written by ess|' >> {{.DIR}}/drift.txt
        comm -12 {{.DIR}}/fresh.list {{.DIR}}/committed.list | while read -r path; do
          cmp -s "{{.FRESH}}/$path" "generated/rust/$path" || echo "generated/rust/$path: differs from what ess generates"
        done >> {{.DIR}}/drift.txt
        comm -12 {{.DIR}}/fresh.all {{.DIR}}/committed.all > {{.DIR}}/both.all
        comm -13 {{.DIR}}/fresh.executable {{.DIR}}/committed.executable | comm -12 - {{.DIR}}/both.all | sed 's|^|generated/rust/|; s|$|: executable, and ess writes it not executable|' >> {{.DIR}}/drift.txt
        comm -23 {{.DIR}}/fresh.executable {{.DIR}}/committed.executable | comm -12 - {{.DIR}}/both.all | sed 's|^|generated/rust/|; s|$|: not executable, and ess writes it executable|' >> {{.DIR}}/drift.txt
        if [ -s {{.DIR}}/drift.txt ]; then
          cat {{.DIR}}/drift.txt
          echo "$(wc -l < {{.DIR}}/drift.txt) path(s) differ from spec/; run task generate"
          exit 1
        fi
      - |
        test -f generated/rust/.ess-output/state.json || { echo "generated/rust/.ess-output/state.json: missing; restore it from git, or remove generated/rust and run task generate"; exit 1; }
        mkdir -p {{.DIR}}/in-place
        { echo .ess-output; cat {{.DIR}}/committed.list; } > {{.DIR}}/copy.list
        tar -cf - -C generated/rust -T {{.DIR}}/copy.list | tar -xf - -C {{.DIR}}/in-place
        {{.SYNTHESIZE}} --out {{.DIR}}/in-place > {{.DIR}}/in-place.log 2>&1 || {
          cat {{.DIR}}/in-place.log
          echo "generated/rust/.ess-output/state.json: ess refuses to regenerate over this record; restore it from git, or remove generated/rust and run task generate"
          exit 1
        }
        diff -rq generated/rust/.ess-output {{.DIR}}/in-place/.ess-output || { echo "generated/rust/.ess-output: regeneration rewrites it; run task generate"; exit 1; }
      - echo "generated/rust matches spec/ ($(wc -l < {{.DIR}}/fresh.list) artifact(s) and .ess-output)"

  build:
    desc: Build the root workspace, hand-written and generated crates, with warnings denied.
    env:
      RUSTFLAGS: -D warnings
    cmds:
      - mkdir -p .out
      - cargo build --workspace --all-targets --locked > .out/build.log 2>&1 || { cat .out/build.log; exit 1; }
      - tail -n 1 .out/build.log

  test:
    desc: Test the root workspace with cargo-nextest and its doc tests with cargo test, warnings denied, within 120 s.
    summary: |
      Test the root workspace with cargo-nextest and its doc tests with cargo test, warnings denied, within 120 s.

      cargo nextest run --workspace runs every test but the doc tests, one process per test, as
      .config/nextest.toml sets it: a test still running after 60 s is ended and fails, and a
      failure does not stop the run. Its log is .out/test.log, its JUnit report
      target/nextest/default/junit.xml. cargo test --doc --workspace runs the doc tests, which
      nextest does not run, into .out/test-doc.log.

      It prints the ten slowest tests from the JUnit report, nextest's summary line, and one
      count line for the whole workspace: "N tests: P passed, F failed, I ignored", where N is
      what nextest ran and skipped plus every doc test, a test nextest ended counts as failed and
      a test nextest skips (#[ignore]) as ignored; after it how many came from each runner.
      Then the wall time of the two commands together, without the time before the task
      started. It fails when a test failed, and when that time is over TEST_BUDGET seconds
      (120), naming the time.

      It depends on task cli (.out/cli/) and on task generated-fresh, the one generation the
      tests of generated-check compare against.
    deps: [cli, generated-fresh]
    env:
      RUSTFLAGS: -D warnings
      SURF_BIN_DIR: '{{.ROOT_DIR}}/target/debug'
    vars:
      TEST_BUDGET: '{{.TEST_BUDGET | default "120"}}'
    silent: true
    cmds:
      - task: build
      - mkdir -p .out
      - |
        junit=target/nextest/default/junit.xml
        rm -f "$junit"
        start=$(date +%s%N)
        tests=0
        cargo nextest run --workspace --locked --color never > .out/test.log 2>&1 || tests=1
        docs=0
        cargo test --doc --workspace --locked --color never > .out/test-doc.log 2>&1 || docs=1
        elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
        if [ "$tests" -ne 0 ]; then cat .out/test.log; fi
        if [ "$docs" -ne 0 ]; then cat .out/test-doc.log; fi
        if [ -f "$junit" ]; then
          echo "the ten slowest tests:"
          sh taskfiles/slowest-tests.sh "$junit" 10
        fi
        summary=$(grep -E '^ *Summary \[' .out/test.log | tail -n 1)
        test -n "$summary" && echo "$summary" | sed 's/^ *//'
        printf '%s\n' "$summary" | sed 's/([^)]*)//g; s/.* run: //' | tr ',' '\n' | awk -v doc="$(awk '/^test result:/ { p += $4; f += $6; i += $8 } END { print p + 0, f + 0, i + 0 }' .out/test-doc.log)" '
          $1 ~ /^[0-9]+$/ { if ($2 == "passed") p += $1; else if ($2 == "skipped") i += $1; else f += $1 }
          END {
            split(doc, d, " ")
            n = p + f + i
            printf "%d tests: %d passed, %d failed, %d ignored (cargo-nextest %d, doc tests %d)\n", n + d[1] + d[2] + d[3], p + d[1], f + d[2], i + d[3], n, d[1] + d[2] + d[3]
          }'
        seconds=$(( elapsed / 1000 )).$(( elapsed % 1000 / 100 ))
        if [ "$elapsed" -gt $(( {{.TEST_BUDGET}} * 1000 )) ]; then
          echo "test step: ${seconds} s, over its budget of {{.TEST_BUDGET}} s"
          exit 1
        fi
        echo "test step: ${seconds} s of its budget of {{.TEST_BUDGET}} s"
        test "$tests" -eq 0 && test "$docs" -eq 0

  open:
    desc: List every open question the specification marks.
    cmds:
      - grep -rn 'UNMAPPED:' spec cli

  check:
    desc: Run the complete repository gate.
    cmds:
      - task: validate
      - task: conform
      - task: conform-rust
      - task: conform-totals
      - task: generated-check
      - task: cli
      - task: lock-check
      - task: test-layout
      - task: tls-certs-check
      - task: tls-flights-check
      - task: build
      - task: test
      - task: agent-tasks-report
      - task: sh-echo
      - task: view-stream-check
      - task: view-test
      - task: html-conformance
      - task: tls-x509-conformance
      - task: forge-watch-test
      - task: planning-only-test
      - task: test-layout-test
      - task: sh-echo-test

  slow:
    desc: Make the committed products of the TLS tests again and compare them with the committed files (the test certificates byte for byte, the recorded flights by outcome); needs openssl 3.4 or later; never a step of check.
    cmds:
      - task: tls-certs-slow
      - task: tls-flights-slow
