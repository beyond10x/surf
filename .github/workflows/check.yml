name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: surf / task check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HTML_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List the files the pull request changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          sed 's/^/  /' "$RUNNER_TEMP/changed-files"
          if sh taskfiles/planning-only.sh < "$RUNNER_TEMP/changed-files"; then
            echo "planning_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "planning_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the toolchain of rust-toolchain.toml
        if: steps.changes.outputs.planning_only != 'true'
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]$/\1/p' rust-toolchain.toml | tr -d '" ')
          test -n "$channel" || { echo "::error::rust-toolchain.toml names no channel" >&2; exit 1; }
          echo "RUST_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          echo "RUST_COMPONENTS=$components" >> "$GITHUB_ENV"
          echo "rust-toolchain.toml: $channel ($components)"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: steps.changes.outputs.planning_only != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: ${{ env.RUST_COMPONENTS }}

      - name: Install go-task
        if: steps.changes.outputs.planning_only != 'true'
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        if: steps.changes.outputs.planning_only != 'true'
        env:
          NEXTEST_VERSION: "0.9.143"
          NEXTEST_SHA256: 66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e
        run: |
          set -euo pipefail
          asset="cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/$asset"
          echo "$NEXTEST_SHA256  $asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          tar -xzf "$asset" -C "$RUNNER_TEMP/nextest-bin" cargo-nextest
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      - name: Install ess
        if: steps.changes.outputs.planning_only != 'true'
        env:
          ESS_VERSION: "0.97.4"
          ESS_SHA256: 235ad6a993c3e81369e3b5439a4ef8d6e2b82df66ad8e4a22809e00557297938
        run: |
          set -euo pipefail
          asset="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/ess/releases/download/$ESS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$ESS_SHA256  $asset" SHA256SUMS
          grep -F "  $asset" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/ess-$ESS_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Export a private XDG_RUNTIME_DIR
        if: steps.changes.outputs.planning_only != 'true'
        run: |
          set -euo pipefail
          if [ -z "${XDG_RUNTIME_DIR:-}" ] || [ ! -d "$XDG_RUNTIME_DIR" ]; then
            dir="$(mktemp -d /tmp/xdg.XXXXXX)"
            chmod 0700 "$dir"
            echo "XDG_RUNTIME_DIR=$dir" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.changes.outputs.planning_only != 'true'
        with:
          node-version: "22"

      - name: Install the page tests' tooling
        if: steps.changes.outputs.planning_only != 'true'
        run: |
          set -euo pipefail
          task --taskfile taskfiles/view-test.yml view-test-setup
          npx --prefix view-tests playwright install --with-deps --only-shell chromium

      - name: Allow the page step's network namespace (taskfiles/page-netns.sh)
        if: steps.changes.outputs.planning_only != 'true'
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sh taskfiles/page-netns.sh ip -brief address

      - name: task check
        if: steps.changes.outputs.planning_only != 'true'
        run: task check

      - name: Planning or prose files only
        if: steps.changes.outputs.planning_only == 'true'
        run: echo "every changed file is a planning or prose file (taskfiles/planning-only.sh); task check is not run"
