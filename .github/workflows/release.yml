# Pre-built `surf` binaries for every release (docs/releasing.md). `task check` runs on `main`
# before the tag is written; this workflow builds, smoke-tests and packages the tagged commit.
# It publishes nothing, on a tag or a manual run: the archives and SHA256SUMS are the run's
# artifacts, and the organization bot creates the release from them after the artifact scan.
# No job writes to the repository.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The package that holds the shipped binary (`crates/surf-cli`); the release tag is its
  # version. The binary is `surf`.
  PACKAGE: surf-cli
  BINARY: surf
  # The toolchain `task check` is measured with; a newer stable can add a lint that
  # `-D warnings` turns into a failed release.
  RUST_TOOLCHAIN: 1.99.1

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Read the package version and check the tag against it
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id=$(cargo pkgid --locked --package "$PACKAGE")
          version=${id##*[#@]}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cannot read a version from the package id $id" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but the package $PACKAGE is at version $version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            kind=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)
            if [ "$kind" != tag ]; then
              echo "::error::$GITHUB_REF_NAME is not an annotated tag" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$PACKAGE $version"

  package:
    name: Package ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl): no glibc floor, and no name service switch module
          # loaded from the host.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Build, test and package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Warnings denied as in `task check`; runner paths kept out of the executable; symbols
          # stripped.
          export RUSTFLAGS="-D warnings --remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/src -C strip=symbols"
          cargo build --locked --release --package "$PACKAGE" --bin "$BINARY" --target "$TARGET"
          # The command-line cases run the binary built above against servers started by the test.
          cargo test --locked --release --package "$PACKAGE" --target "$TARGET" --test cli
          bin="target/$TARGET/release/$BINARY"
          case "$TARGET" in
            *-linux-*)
              if readelf -lW "$bin" | grep INTERP; then
                echo "::error::$bin is dynamically linked" >&2
                exit 1
              fi
              ;;
          esac
          if strings -a "$bin" | grep -E '/(home|Users)/'; then
            echo "::error::$bin holds a home directory path" >&2
            exit 1
          fi
          package="$BINARY-$VERSION-$TARGET"
          mkdir -p "dist/$package"
          cp "$bin" "dist/$package/"
          # Every archive carries the licence and the notice beside the binary.
          notices=(README.md LICENSE NOTICE)
          cp "${notices[@]}" "dist/$package/"
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$package.tar.gz" "$package"
          # The packed binary is executable and runs: a usage error, then an unreachable address.
          check="$RUNNER_TEMP/unpacked"
          mkdir -p "$check"
          tar -C "$check" -xzf "dist/$package.tar.gz"
          unpacked="$check/$package/$BINARY"
          test -x "$unpacked"
          status=0
          "$unpacked" 2>/dev/null || status=$?
          [ "$status" = 2 ] || { echo "::error::$BINARY without an argument exited $status, not 2" >&2; exit 1; }
          status=0
          out=$("$unpacked" http://127.0.0.1:1/ 2>/dev/null) || status=$?
          [ "$status" = 1 ] || { echo "::error::$BINARY http://127.0.0.1:1/ exited $status, not 1" >&2; exit 1; }
          grep -q '^fetch-failed .* Unreachable http://127.0.0.1:1/$' <<<"$out"
          tar -tzvf "dist/$package.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: Verify archives and write checksums
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify archives and write SHA256SUMS
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            archive="$BINARY-$VERSION-$target.tar.gz"
            test -f "$archive" || { echo "::error::missing $archive" >&2; exit 1; }
          done
          sha256sum "$BINARY"-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
