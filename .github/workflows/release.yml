# Pre-built binaries of surf for every release (docs/releasing.md): `surf`, `surf-agent`, `surfd`
# and `surf-session` for Linux, `surf` for macOS. `task check` runs on `main` before the tag is
# written; this workflow builds, smoke-tests and packages the tagged commit.
# It publishes nothing, on a tag or a manual run: the archives and SHA256SUMS are the run's
# artifacts, and the organization bot creates the release from them after the artifact scan.
# No job writes to the repository.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The package of the binary `surf` (`crates/surf-cli`); the release tag is its version. The
  # agent packages `surf-agent`, `surfd` and `surf-session` carry the same version.
  PACKAGE: surf-cli
  # The archives are `surf-<version>-<target>.tar.gz`.
  ARCHIVE: surf
  # The plain container the static check of each Linux archive runs `surf-agent` in: the tag
  # alpine:3.24.4, named by the digest of its multi-arch index (amd64 and arm64).
  STATIC_IMAGE: alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the toolchain of rust-toolchain.toml
        run: |
          set -euo pipefail
          # The toolchain `task check` is measured with, from the one file both workflows read;
          # a newer stable can add a lint that `-D warnings` turns into a failed release.
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]$/\1/p' rust-toolchain.toml | tr -d '" ')
          test -n "$channel" || { echo "::error::rust-toolchain.toml names no channel" >&2; exit 1; }
          echo "RUST_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          echo "RUST_COMPONENTS=$components" >> "$GITHUB_ENV"
          echo "rust-toolchain.toml: $channel ($components)"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: ${{ env.RUST_COMPONENTS }}
      - name: Read the package version and check the tag against it
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id=$(cargo pkgid --locked --package "$PACKAGE")
          version=${id##*[#@]}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cannot read a version from the package id $id" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but the package $PACKAGE is at version $version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            kind=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)
            if [ "$kind" != tag ]; then
              echo "::error::$GITHUB_REF_NAME is not an annotated tag" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$PACKAGE $version"

  package:
    name: Package ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl): no glibc floor, and no name service switch module
          # loaded from the host.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the toolchain of rust-toolchain.toml
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          components=$(sed -n 's/^components = \[\(.*\)\]$/\1/p' rust-toolchain.toml | tr -d '" ')
          test -n "$channel" || { echo "::error::rust-toolchain.toml names no channel" >&2; exit 1; }
          echo "RUST_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          echo "RUST_COMPONENTS=$components" >> "$GITHUB_ENV"
          echo "rust-toolchain.toml: $channel ($components)"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: ${{ env.RUST_COMPONENTS }}
          targets: ${{ matrix.target }}
      - name: Set the build flags
        run: |
          set -euo pipefail
          # Warnings denied as in `task check`; runner paths kept out of the executables; symbols
          # stripped. The smoke test builds its case with the same flags, so it reuses what the test
          # of the next step compiled under target/.
          echo "RUSTFLAGS=-D warnings --remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/src -C strip=symbols" >> "$GITHUB_ENV"
      # ring, the one outside crate of `surf-tls`, compiles C and assembly with the C compiler
      # cc finds for the target. The Linux images have none for musl, and without one ring's
      # build fails (`failed to find tool "x86_64-linux-musl-gcc"`); musl-tools installs
      # `musl-gcc`, which makes static objects. The macOS images build ring with Apple clang
      # and need no step (docs/design/tls.md, item 3).
      - name: Install a C compiler that targets musl, for ring
        if: contains(matrix.target, '-linux-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build, test and package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The test comes first and the shipped binaries are built after it, into a directory
          # of their own. The test's dev-dependencies turn on the feature `test-tooling` of
          # `surf-tls` in every crate the test build compiles, so the `surf` it builds under
          # target/$TARGET/release has that feature and carries its marker "surf-tls
          # test-tooling, never in a release" (docs/design/tls.md, item 6). A build
          # of `--bins` only turns on no dev-dependency feature, and target/ship holds no file of
          # the test build. The cost: ring and every crate the two builds share compile twice.
          # The command-line cases run the `surf` the test builds against servers it starts.
          cargo test --locked --release --package "$PACKAGE" --target "$TARGET" --test main cli:: -- --skip review1_cli::
          case "$TARGET" in
            *-linux-*)
              # The agent binaries find each other in one directory: `surf-agent` starts `surfd`
              # from its own, and `surfd` starts `surf-session` from its own.
              binaries=(surf surf-agent surfd surf-session)
              cargo build --locked --release -p surf-cli -p surf-agent -p surfd -p surf-session --bins --target "$TARGET" --target-dir target/ship
              ;;
            *)
              # macOS gets `surf` only. The agent binaries build there and cannot run there:
              # `surf_agent::wire::caller_uid` reads the owner of /proc/self, which macOS does
              # not have, and `surf-agent` and `surfd` require XDG_RUNTIME_DIR, which macOS does
              # not set.
              binaries=(surf)
              cargo build --locked --release --package "$PACKAGE" --bin surf --target "$TARGET" --target-dir target/ship
              ;;
          esac
          # The marker search, checked once on the binary the test built, which must hold the
          # marker; a search that finds nothing there would pass every shipped binary.
          marker="surf-tls test-tooling, never in a release"
          if ! grep -q -F "$marker" "target/$TARGET/release/surf"; then
            echo "::error::the marker search finds no marker in target/$TARGET/release/surf, the binary the test built" >&2
            exit 1
          fi
          echo "the marker search finds the marker in target/$TARGET/release/surf, the binary the test built"
          package="$ARCHIVE-$VERSION-$TARGET"
          mkdir -p "dist/$package"
          for binary in "${binaries[@]}"; do
            bin="target/ship/$TARGET/release/$binary"
            if strings -a "$bin" | grep -E '/(home|Users)/'; then
              echo "::error::$bin holds a home directory path" >&2
              exit 1
            fi
            if grep -q -F "$marker" "$bin"; then
              echo "::error::$bin holds the marker \"$marker\": it was built with test-tooling" >&2
              exit 1
            fi
            echo "the marker search finds no marker in $bin"
            cp "$bin" "dist/$package/"
          done
          # Every archive carries the licence and the notice beside the binaries.
          notices=(README.md LICENSE NOTICE)
          cp "${notices[@]}" "dist/$package/"
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$package.tar.gz" "$package"
          tar -tzvf "dist/$package.tar.gz"
      - name: Smoke-test the unpacked archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/unpacked"
          mkdir -p "$check"
          tar -C "$check" -xzf "dist/$ARCHIVE-$VERSION-$TARGET.tar.gz"
          # What the directory holds; `surf` on a usage error, on an unreachable `http:` and
          # `https:` address, and `surf --anchors` against crates/tls/src/anchors/SOURCE; on
          # Linux, in a private XDG_RUNTIME_DIR, `surf-agent open`, `go`, `look` and `close` on
          # a local page through the unpacked `surfd` and `surf-session`
          # (crates/session/tests/e2e.rs), then no process left from the directory, then
          # `surf-agent help --for-agent` in an empty environment: exit 0, a final line feed, the
          # version of the directory's name in its first line. The same script runs on a
          # workstation.
          sh taskfiles/release-smoke.sh "$check/$ARCHIVE-$VERSION-$TARGET" "$TARGET"
      # Before the upload, so that a Linux archive that fails the check is never uploaded.
      - name: Check that the Linux binaries are static and run in a plain container
        if: contains(matrix.target, '-linux-')
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The directory the smoke step unpacked: for each of the four binaries, no program
          # interpreter header (readelf -lW) and no needed library (readelf -d); then
          # `surf-agent help --for-agent` from it in the image STATIC_IMAGE, without network,
          # with the version of the directory's name in its first line (docs/releasing.md). A
          # runner without docker fails the step.
          sh taskfiles/release-static.sh "$RUNNER_TEMP/unpacked/$ARCHIVE-$VERSION-$TARGET" --image "$STATIC_IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: Verify archives and write checksums
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify archives and write SHA256SUMS
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            archive="$ARCHIVE-$VERSION-$target.tar.gz"
            test -f "$archive" || { echo "::error::missing $archive" >&2; exit 1; }
          done
          sha256sum "$ARCHIVE"-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
