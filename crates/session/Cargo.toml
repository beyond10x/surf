[package]
name = "surf-session"
description = "One surf agent session: a library core over any transport, and the binary surf-session that surfd starts and alone connects to, with the standard library only."
version = "0.7.0"
edition = "2024"
publish = false
license = "Apache-2.0"
autotests = false

[lib]
name = "surf_session"
path = "src/lib.rs"
test = false

[[bin]]
name = "surf-session"
path = "src/main.rs"
test = false

[dependencies]
surf = { path = "../surf" }
surf-ports = { path = "../ports" }
surf-fetch = { path = "../fetch" }
surf-cookie = { path = "../cookie" }
surf-answer = { path = "../answer" }
surf-html = { path = "../html" }
surf-page = { path = "../page" }
surf-page-text = { path = "../page-text" }
surf-secret = { path = "../secret" }
surf-url = { path = "../url" }
surf-agent = { path = "../agent" }
surfd = { path = "../surfd" }
surf-types = { path = "../../generated/rust/crates/surf-types" }

[dev-dependencies]
surf-test-process = { path = "../test-process" }
surf-tls-test-server = { path = "../tls-test-server" }

[[test]]
name = "main"
path = "tests/main.rs"
