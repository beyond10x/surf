<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body>
<h1>Garden Box</h1>
<p>Sign in to see your deliveries.</p>
<form method="post" action="login">

<label for="password">Password</label>
<input type="password" id="password" name="password">

</form>
</body>
</html>
