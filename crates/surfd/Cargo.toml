[package]
name = "surfd"
description = "The surf daemon, one per user: the session list, one session process per session, routing on $XDG_RUNTIME_DIR/surf/surfd.sock, with the standard library only. It holds no page."
version = "0.5.0"
edition = "2024"
publish = false
license = "Apache-2.0"
autotests = false

[lib]
name = "surfd"
path = "src/lib.rs"

[[bin]]
name = "surfd"
path = "src/main.rs"
test = false

[dependencies]
surf-agent = { path = "../agent" }
surf-answer = { path = "../answer" }
surf-secret = { path = "../secret" }
surf-view = { path = "../view" }

[dev-dependencies]
surf-test-process = { path = "../test-process" }

[[test]]
name = "main"
path = "tests/main.rs"
