[package]
name = "surf-agent"
description = "The agent command line of surf: a parser held to cli/surf-agent.yaml, the token, the file of extra trust anchors read with surf-tls, and the wire to surfd."
version = "0.6.0"
edition = "2024"
publish = false
license = "Apache-2.0"
autotests = false

[lib]
name = "surf_agent"
path = "src/lib.rs"
test = false

[[bin]]
name = "surf-agent"
path = "src/main.rs"
test = false

[dependencies]
surf-answer = { path = "../answer" }
surf-secret = { path = "../secret" }
surf-tls = { path = "../tls" }

[dev-dependencies]
surf-test-process = { path = "../test-process" }

[[test]]
name = "main"
path = "tests/main.rs"
