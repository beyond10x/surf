[package]
name = "surf"
description = "The surf system assembled with a transport for the net component."
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
autotests = false

[lib]
test = false

[dependencies]
surf-types = { path = "../../generated/rust/crates/surf-types" }
surf-system = { path = "../../generated/rust/crates/surf-system" }
shell = { path = "../../generated/rust/crates/shell" }
navigator = { path = "../../generated/rust/crates/navigator" }
net = { path = "../../generated/rust/crates/net" }
document = { path = "../../generated/rust/crates/document" }
renderer = { path = "../../generated/rust/crates/renderer" }
agent = { path = "../../generated/rust/crates/agent" }
surf-ports = { path = "../ports" }
surf-fetch = { path = "../fetch" }
surf-html = { path = "../html" }
surf-page = { path = "../page" }

[[test]]
name = "main"
path = "tests/main.rs"
