[package]
name = "surf-html-conformance"
description = "Runs the vendored html5lib-tests and web-platform-tests parser data against surf-html and counts the cases that exist, run and pass."
version = "0.1.0"
edition = "2024"
publish = false
default-run = "surf-html-conformance"
license = "Apache-2.0"
autotests = false

[lib]
test = false

[[bin]]
name = "surf-html-conformance"
path = "src/main.rs"
test = false

[[bin]]
name = "entities-table"
path = "src/bin/entities-table.rs"
test = false

[dependencies]
surf-html = { path = "../html" }

[dev-dependencies]

[[test]]
name = "main"
path = "tests/main.rs"
