[package]
name = "surf-tls"
description = "TLS 1.3 for surf: the one crate that wraps the cryptographic primitives of ring, behind its module crypto."
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
autotests = false

[features]
default = []
test-tooling = []

[dependencies]
ring = "=0.17.14"

[dev-dependencies]
surf-tls = { path = ".", features = ["test-tooling"] }
surf-html-conformance = { path = "../html-conformance" }

[[test]]
name = "main"
path = "tests/main.rs"
