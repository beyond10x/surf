[package]
name = "surf-tls-test-server"
description = "Test tooling of surf-tls, never shipped: a TLS 1.3 server on 127.0.0.1 for end-to-end tests, with the misbehaviours the negative cases need."
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
autotests = false

[dependencies]
surf-tls = { path = "../tls", features = ["test-tooling"] }

[[test]]
name = "main"
path = "tests/main.rs"
